<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clearance</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400..800&family=Atkinson+Hyperlegible+Mono:wght@400..800&family=Dela+Gothic+One&display=swap">
<style>
:root { --ink: #141414; --paper: #FFFFFF; --dot: #E3E3E3; --muted: #4A4A4A; --red: #E8341C; --yellow: #FFC21A; --blue: #2F6FE0; --screen: #1C1F2B }
* { box-sizing: border-box }
body { margin: 0; color: var(--ink); background: var(--paper) radial-gradient(var(--dot) 1px, transparent 1px) 0 0 / 7px 7px; font: 400 16px/1.5 'Atkinson Hyperlegible Next', system-ui, sans-serif }
header { margin: 0 auto; padding: 20px 16px 8px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap }
h1 { margin: 0; font: 400 36px/1 'Dela Gothic One', sans-serif; text-shadow: 3px 3px 0 var(--yellow) }
#status { font-size: 13px; font-weight: 700; padding: 4px 10px; border: 2px solid var(--ink); border-radius: 999px; background: #FFF }
main { margin: 0 auto; padding: 8px 16px 48px; display: grid; gap: 28px }
h2 { display: inline-block; margin: 0 0 12px; padding: 4px 12px; background: var(--ink); color: #FFF; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase }
.cards { display: grid; gap: 16px }
/* The board across the whole screen: waiting, done, then a rail for the crews; they wrap on a narrow
   screen. No request card: Waiting shrinks and Done, the one to read, takes the room. */
.columns { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start }
.columns[hidden] { display: none }
.columns > * { min-width: 0 }
#waiting { flex: 1.2 1 480px } #waiting:not(:has(.cards > *)) { flex: 0 1 340px }
#done { flex: 2 1 460px }
#done .cards { grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); align-items: start }
.rail { flex: 1 0 280px; max-width: 320px; display: grid; gap: 28px }
.card { background: #FFF; border: 3px solid var(--ink); border-radius: 6px; box-shadow: 5px 5px 0 var(--ink); padding: 14px 16px; display: grid; gap: 10px }
.card.risk-infra { box-shadow: 5px 5px 0 var(--red) }
.who { display: flex; align-items: center; gap: 12px; flex-wrap: wrap }
.who > div { display: grid; flex: 1 1 160px }
.meta { color: var(--muted); font-size: 13px }
.badge, .risk, .chip { font-size: 12px; font-weight: 800; padding: 2px 8px; border: 2px solid var(--ink); border-radius: 999px; letter-spacing: .04em; white-space: nowrap }
.risk.read { background: #ECEEF2 } .risk.write { background: var(--yellow) } .risk.infra { background: var(--red); color: #FFF }
pre { margin: 0; padding: 10px 12px; background: var(--screen); color: #F4F4F4; border-radius: 4px; font: 13px/1.5 'Atkinson Hyperlegible Mono', ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto }
.cmd { font-size: 14px }
.tool, .desc { margin: 0; color: var(--muted) }
.question { margin: 0; font-weight: 700 }
details summary { cursor: pointer; font-size: 13px; color: var(--muted) }
details pre { margin-top: 6px }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
button { min-height: 44px; padding: 0 16px; font: 700 15px 'Atkinson Hyperlegible Next', system-ui, sans-serif; color: var(--ink); background: #FFF; border: 2px solid var(--ink); border-radius: 999px; cursor: pointer }
button.primary { background: var(--ink); color: #FFF }
button.quiet { border-color: transparent; background: transparent; text-decoration: underline }
button:disabled { opacity: .4; cursor: not-allowed }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px }
input[type=text], textarea, select { min-height: 44px; padding: 8px 12px; font: inherit; color: var(--ink); background: #FFF; border: 2px solid var(--ink); border-radius: 6px }
input[type=text] { flex: 1 1 220px }
input[name=go] { flex: 0 0 120px; font-weight: 800; text-align: center; letter-spacing: .1em }
textarea { width: 100%; resize: vertical }
label.mode { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px }
fieldset { margin: 0; padding: 0; border: 0; display: grid; gap: 6px }
legend { margin-bottom: 6px; font-weight: 800 }
.option { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 2px solid var(--ink); border-radius: 6px; cursor: pointer }
.option input { margin-top: 4px }
.option small { display: block; color: var(--muted) }
.option:has(input:checked) { background: #E4EDFB }
.error { margin: 0; color: var(--red); font-weight: 700 }
.error:empty { display: none }
.empty { margin: 0; color: var(--muted) }
.terminal { display: grid; gap: 6px; margin-top: 12px }
.terminal-wait { display: flex; align-items: center; gap: 10px; color: var(--muted) }
.message { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere }
.message .heading { font-size: 17px }
.message code { font: 14px 'Atkinson Hyperlegible Mono', ui-monospace, Consolas, monospace; padding: 0 4px; background: #F0F0F0; border-radius: 3px }
.crew { display: flex; flex-wrap: wrap; gap: 18px }
.worker { width: 120px; display: grid; justify-items: center; gap: 2px; text-align: center }
.clones { display: flex; align-items: flex-end; gap: 2px; font-size: 12px; font-weight: 800 }
.avatar svg { display: block; overflow: visible }
a.button { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; font-weight: 800; font-size: 14px; color: var(--ink); text-decoration: none; background: #FFF; border: 2px solid var(--ink); border-radius: 999px }
.energy { display: block; width: 64px; height: 6px; background: #FFF; border: 1.5px solid var(--ink); border-radius: 3px; overflow: hidden }
.energy > span { display: block; height: 100%; background: var(--ink) }
.energy.low > span { background: var(--red) }
.rule { display: grid; gap: 4px; padding: 10px 0; border-bottom: 1px solid var(--dot) }
.rule code { font: 800 14px 'Atkinson Hyperlegible Mono', ui-monospace, Consolas, monospace }
#journal > div, #detail-body > div { display: grid; gap: 18px }
form.instruct { display: grid; gap: 8px }
form.instruct p { margin: 0 } form.instruct p:empty { display: none }
form.start { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; align-items: end }
form.start label { display: grid; gap: 4px; font-size: 13px; font-weight: 700 }
form.start label.check { display: flex; align-items: center; gap: 8px; min-height: 44px }
form.start > .actions:last-of-type, form.start [role=status], .picker { grid-column: 1 / -1 }
.picker { display: grid; gap: 8px; padding: 12px; border: 2px dashed var(--ink); border-radius: 6px }
.picker[hidden] { display: none }
.picker .folders { display: flex; flex-wrap: wrap; gap: 6px; max-height: 260px; overflow: auto }
.picker .folders button { min-height: 36px; font-weight: 700 }
.picker code { font: 700 13px 'Atkinson Hyperlegible Mono', ui-monospace, Consolas, monospace; word-break: break-all }
a.name { color: var(--ink); font-weight: 800; text-decoration: none; border-bottom: 2px solid var(--yellow) }
a.name:hover { background: var(--yellow) }
a.back { display: inline-block; margin-bottom: 14px; color: var(--ink); font-weight: 800 }
#detail { display: grid; gap: 18px }
#detail[hidden], #journal[hidden] { display: none }
#detail h3 { margin: 0; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase }
#detail h4 { margin: 4px 0 0; font-size: 15px }
.head { display: flex; gap: 16px; align-items: center; flex-wrap: wrap }
.head .grow { display: grid; gap: 6px; flex: 1 1 260px }
.head h2 { margin: 0; padding: 0; background: none; color: var(--ink); font: 800 24px/1.2 'Atkinson Hyperlegible Next', system-ui, sans-serif; letter-spacing: 0; text-transform: none }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.phases { display: flex; flex-wrap: wrap; gap: 6px 0 }
.phase { padding: 6px 14px; margin-right: -3px; font-size: 13px; font-weight: 800; background: #FFF; border: 3px solid var(--ink) }
.phase.past { background: var(--ink); color: #FFF }
.phase.now { background: var(--yellow) }
.phase.next { color: var(--muted); border-style: dashed }
.agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px }
.agent { padding: 10px; display: grid; gap: 6px; align-content: start; background: #FFF; border: 2px solid var(--ink); border-radius: 6px }
.agent.running { box-shadow: 4px 4px 0 var(--yellow) }
.result { margin: 0; font-size: 13px; max-height: 6em; overflow: auto; word-break: break-word }
.bad { color: var(--red); font-weight: 800 }
.thread { display: grid; gap: 4px }
.bubble { justify-self: end; max-width: 80%; margin: 8px 0; padding: 8px 12px; white-space: pre-wrap; background: #FFF; border: 2px solid var(--ink); border-radius: 16px 16px 4px 16px }
.step { margin: 0; font: 13px/1.4 'Atkinson Hyperlegible Mono', ui-monospace, Consolas, monospace; color: var(--muted); word-break: break-word }
.step.bad { color: var(--red) }
pre.del { background: #4A1F1F } pre.add { background: #1E4A2B }
.scroll { overflow-x: auto }
table { width: 100%; border-collapse: collapse; font-size: 14px }
th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--dot) }
@keyframes cb-bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-1.6px) } }
@keyframes cb-drip { 0% { transform: translateY(-2px); opacity: 0 } 25% { opacity: 1 } 100% { transform: translateY(5px); opacity: 0 } }
@keyframes cb-throb { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.28) } }
@keyframes cb-twinkle { 0%, 100% { transform: scale(.7); opacity: .6 } 50% { transform: scale(1.15); opacity: 1 } }
@keyframes cb-float { 0% { transform: translate(0, 3px); opacity: 0 } 30% { opacity: 1 } 100% { transform: translate(3px, -5px); opacity: 0 } }
@keyframes cb-shake { 0%, 100% { transform: translateX(0) } 25% { transform: translateX(-1.2px) } 75% { transform: translateX(1.2px) } }
@keyframes cb-speed { 0%, 100% { opacity: .2 } 50% { opacity: .85 } }
@keyframes cb-spin { to { transform: rotate(360deg) } }
@keyframes cb-boing { 0%, 100% { transform: rotate(-6deg) } 50% { transform: rotate(6deg) } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important } }
</style>
</head>
<body>
<header>
  <h1>clearance</h1>
  <button id="new" class="primary" aria-controls="start" aria-expanded="false">+ Start a session</button>
  <span id="status" role="status">connecting...</span>
  <span id="quota" class="chip" hidden></span>
  <a id="journal-link" class="button" href="#journal">Journal</a>
  <button id="notify" hidden>Turn on notifications</button>
  <button id="pack"></button>
</header>
<main>
  <section id="start" aria-labelledby="h-start" hidden>
    <h2 id="h-start">Start a session</h2>
    <form class="card start">
      <label>Folder <input type="text" name="cwd" required placeholder="The project's folder, full path"></label>
      <div class="actions"><button type="button" id="browse">Browse...</button></div>
      <div class="picker" hidden></div>
      <label>Name <input type="text" name="name" required pattern="[\w.\-]{1,40}" placeholder="also the tab's title"></label>
      <label>Model
        <select name="model"><option value="">default</option><option value="fable">Fable</option><option value="opus">Opus</option><option value="sonnet">Sonnet</option><option value="haiku">Haiku</option></select>
      </label>
      <label>Mode
        <select name="mode"><option value="">default</option><option value="default">ask</option><option value="acceptEdits">edits</option><option value="plan">plan</option><option value="auto">auto</option></select>
      </label>
      <label class="check"><input type="checkbox" name="connect" checked> Connect to clearance (hooks and companion mod)</label>
      <div class="actions"><button class="primary" type="submit">Start in a new tab</button></div>
      <p class="meta" role="status"></p>
    </form>
  </section>
  <div class="columns">
  <section id="waiting" aria-labelledby="h-waiting">
    <h2 id="h-waiting">Waiting for you</h2>
    <p class="empty">Nobody is waiting for you.</p>
    <div class="cards"></div>
    <div class="terminal"></div>
  </section>
  <section id="done" aria-labelledby="h-done">
    <h2 id="h-done">Done</h2>
    <p class="empty">Nothing left to read.</p>
    <div class="cards"></div>
  </section>
  <div class="rail">
  <section id="working" aria-labelledby="h-working">
    <h2 id="h-working">Working</h2>
    <p class="empty">Nobody is working.</p>
    <div class="crew"></div>
  </section>
  <section id="ignored" aria-labelledby="h-ignored" hidden>
    <h2 id="h-ignored">Ignored</h2>
    <div class="crew"></div>
  </section>
  <section id="asleep" aria-labelledby="h-asleep" hidden>
    <h2 id="h-asleep">Asleep</h2>
    <div class="crew"></div>
  </section>
  </div>
  </div>
  <section id="detail" hidden></section>
  <section id="journal" hidden></section>
</main>
<script>
// Everything that comes from a session (commands, questions, messages) goes through h() as text,
// never through innerHTML. The avatar SVG is built from constants only.
const $ = (sel, root = document) => root.querySelector(sel)

function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v)
    else if (k === 'class') el.className = v
    else el.setAttribute(k, v === true ? '' : v)
  }
  for (const c of children.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c))
  return el
}

// ---- avatars (design/canvas/Chibi.dc.html, BRIEF section 4) ----
// Hair colour: the project, from its folder name.
const PALETTE = [['#3D7BE0', '#1F4E9E', '#E4EDFB'], ['#8B5CF6', '#5B2FC0', '#EFE8FE'], ['#13A3A3', '#0B6B6B', '#DDF4F4'], ['#F06292', '#B0305C', '#FDE6EE'], ['#3BAA5C', '#22743A', '#E2F4E7'], ['#F08A24', '#A85A0C', '#FDEEDC'], ['#8A94A6', '#4F5869', '#ECEEF2']]
const project = (cwd = '') => cwd.split(/[\\/]/).filter(Boolean).pop() || 'unknown'
const colours = (name) => PALETTE[[...name].reduce((n, c) => (n * 31 + c.charCodeAt(0)) >>> 0, 7) % PALETTE.length]

const NONE = 'M0 0'
const OPEN = 'M23.3 33 a2.2 3 0 1 0 4.4 0 a2.2 3 0 1 0 -4.4 0 M36.3 33 a2.2 3 0 1 0 4.4 0 a2.2 3 0 1 0 -4.4 0'
const WIDE = 'M22.9 33 a2.6 3.6 0 1 0 5.2 0 a2.6 3.6 0 1 0 -5.2 0 M35.9 33 a2.6 3.6 0 1 0 5.2 0 a2.6 3.6 0 1 0 -5.2 0'
const EYES = {
  work: [OPEN, NONE], wait: [OPEN, NONE], go: [WIDE, NONE], question: [OPEN, NONE],
  denied: [NONE, 'M23 31 L27.5 33 L23 35 M41 31 L36.5 33 L41 35'],
  done: [NONE, 'M23 34 Q25.5 30.5 28 34 M36 34 Q38.5 30.5 41 34'],
  sleep: [NONE, 'M23 33.5 Q25.5 35 28 33.5 M36 33.5 Q38.5 35 41 33.5'],
  dizzy: [NONE, 'M25.5 33 m-2.6 0 a2.6 2.6 0 1 0 2.6 -2.6 a1.6 1.6 0 1 0 1.6 1.6 M38.5 33 m-2.6 0 a2.6 2.6 0 1 0 2.6 -2.6 a1.6 1.6 0 1 0 1.6 1.6'],
}
const BROWS = {
  dizzy: 'M22.5 28.5 Q25.5 27.5 28 28.5 M36 28.5 Q38.5 27.5 41.5 28.5',
  work: 'M22.5 28 L28 29.2 M41.5 28 L36 29.2', wait: 'M22.5 29 L28 27.8 M41.5 29 L36 27.8',
  go: 'M22.5 27 Q25.5 25.5 28 27 M36 27 Q38.5 25.5 41.5 27', question: 'M22.5 27 Q25.5 25.5 28 27 M36 28.5 L41.5 28.5',
  denied: 'M22.5 27.5 L28 29.8 M41.5 27.5 L36 29.8',
}
const MOUTH = {
  work: [NONE, 'M30 41.5 L34 41.5'], wait: [NONE, 'M28.5 42 Q30.2 40.8 32 42 Q33.8 43.2 35.5 42'],
  go: ['M32 39.6 a2 2.4 0 1 0 0.01 0', NONE], question: [NONE, 'M30.5 42 Q32 41 33.5 42'],
  denied: [NONE, 'M28.5 42.5 L30.2 41 L32 42.5 L33.8 41 L35.5 42.5'],
  done: ['M27.5 40.2 Q32 40.8 36.5 40.2 Q36 45 32 45 Q28 45 27.5 40.2 Z', NONE],
  sleep: [NONE, 'M32 41.2 a1.1 1.1 0 1 0 0.01 0'],
  dizzy: [NONE, 'M28.5 42 Q30.2 40.8 32 42 Q33.8 43.2 35.5 42'],
}
const SWEAT = '<g style="transform-box:fill-box;animation:cb-drip 1.8s ease-in infinite"><path d="M51 14.5 Q48.2 19.6 51 21.9 Q53.8 19.6 51 14.5 Z" fill="#8FD0F7" stroke="#2A6F9E"/></g>'
const SYMBOL = {
  sleep: '<text x="47" y="15" font-family="\'Dela Gothic One\', sans-serif" font-size="7" fill="#141414" style="animation:cb-float 2.4s ease-out infinite">z</text><text x="52" y="9" font-family="\'Dela Gothic One\', sans-serif" font-size="10" fill="#141414" style="animation:cb-float 2.4s ease-out .8s infinite">Z</text>',
  dizzy: SWEAT + '<g style="transform-box:fill-box;transform-origin:center;animation:cb-spin 2.4s linear infinite"><path d="M32 4.5 L33 6.6 L35.3 6.9 L33.6 8.4 L34.1 10.7 L32 9.6 L29.9 10.7 L30.4 8.4 L28.7 6.9 L31 6.6 Z M22 7.5 L22.7 8.9 L24.2 9.1 L23.1 10.1 L23.4 11.6 L22 10.9 L20.6 11.6 L20.9 10.1 L19.8 9.1 L21.3 8.9 Z M42 7.5 L42.7 8.9 L44.2 9.1 L43.1 10.1 L43.4 11.6 L42 10.9 L40.6 11.6 L40.9 10.1 L39.8 9.1 L41.3 8.9 Z" fill="#FFC21A" stroke="#141414" stroke-width=".6"/></g>',
  work: '<g style="animation:cb-speed .9s ease-in-out infinite"><path d="M2.5 22 L10.5 24 M1.5 32 L9.5 32 M2.5 42 L10.5 40 M61.5 22 L53.5 24 M62.5 32 L54.5 32 M61.5 42 L53.5 40" stroke="#141414" stroke-width="1.4" stroke-linecap="round"/></g>',
  wait: SWEAT,
  go: '<g style="animation:cb-shake .45s ease-in-out infinite"><path d="M52 2 L57.6 2 L55.9 14.6 L53.7 14.6 Z" fill="#E8341C" stroke="#141414" stroke-linejoin="round"/><circle cx="54.8" cy="17.4" r="1.9" fill="#E8341C" stroke="#141414"/></g>',
  question: '<g style="animation:cb-bob 1.6s ease-in-out infinite"><text x="55" y="16.5" text-anchor="middle" font-family="\'Dela Gothic One\', sans-serif" font-size="16" fill="#2F6FE0" stroke="#141414" stroke-width=".8">?</text></g>',
  denied: '<g style="transform-box:fill-box;transform-origin:center;animation:cb-throb .9s ease-in-out infinite"><path d="M47.5 10 Q50 12.5 47.5 15 M49.5 8 Q52 10.5 54.5 8 M56.5 10 Q54 12.5 56.5 15 M49.5 17 Q52 14.5 54.5 17" stroke="#E8341C" stroke-width="2.3" fill="none" stroke-linecap="round"/></g>',
  done: '<path style="transform-box:fill-box;transform-origin:center;animation:cb-twinkle 1.4s ease-in-out infinite" d="M53 3 L54.3 7.7 L59 9 L54.3 10.3 L53 15 L51.7 10.3 L47 9 L51.7 7.7 Z" fill="#FFC21A" stroke="#141414" stroke-width=".8" stroke-linejoin="round"/><path style="transform-box:fill-box;transform-origin:center;animation:cb-twinkle 1.4s ease-in-out .7s infinite" d="M10 6 L10.8 8.7 L13.5 9.5 L10.8 10.3 L10 13 L9.2 10.3 L6.5 9.5 L9.2 8.7 Z" fill="#FFC21A" stroke="#141414" stroke-width=".7" stroke-linejoin="round"/>',
}

// The model's accessory: glasses for Opus, headphones for Sonnet, a cowlick (or an antenna) for Haiku.
const gearOf = (model = '') => /opus/.test(model) ? 'opus' : /sonnet/.test(model) ? 'sonnet' : /haiku/.test(model) ? 'haiku' : ''
const CHIBI_GEAR = {
  haiku: (hair) => `<path d="M31 11.5 Q33 2.5 40 4.5 Q35 5.5 33.5 11.5 Z" fill="${hair}" stroke="#141414" stroke-width="1.1" stroke-linejoin="round"/>`,
  sonnet: (hair) => `<path d="M14.5 30 Q13.5 7.5 32 7.5 Q50.5 7.5 49.5 30" stroke="#141414" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="10.5" y="25.5" width="6" height="10.5" rx="2.4" fill="#141414"/><rect x="47.5" y="25.5" width="6" height="10.5" rx="2.4" fill="#141414"/><rect x="11.8" y="27.5" width="3.4" height="6.5" rx="1.4" fill="${hair}"/><rect x="48.8" y="27.5" width="3.4" height="6.5" rx="1.4" fill="${hair}"/>`,
  opus: () => '<path d="M25.5 33 m-4.8 0 a4.8 4.8 0 1 0 9.6 0 a4.8 4.8 0 1 0 -9.6 0 M38.5 33 m-4.8 0 a4.8 4.8 0 1 0 9.6 0 a4.8 4.8 0 1 0 -9.6 0" fill="rgba(255,255,255,.18)" stroke="#141414" stroke-width="1.4"/><path d="M30.3 32.5 Q32 31.5 33.7 32.5" fill="none" stroke="#141414" stroke-width="1.4"/><path d="M22 30.4 L23.6 29.2 M35 30.4 L36.6 29.2" stroke="#FFF" stroke-width="1.1" stroke-linecap="round"/>',
}

// Unknown states (an error stop, an idle session) draw a plain face with no symbol.
// The Halloween pack: a witch's hat and a cape over the same chibi. The hair still shows the project.
const HAT = '<path d="M20 13 Q24 -2 37 -6 Q35 2 44 13 Z" fill="#3B2A5A" stroke="#141414" stroke-width="1.3" stroke-linejoin="round"/><ellipse cx="32" cy="13.5" rx="21" ry="3.6" fill="#3B2A5A" stroke="#141414" stroke-width="1.3"/><path d="M21.6 10.6 Q32 13 42.4 10.6 L42.9 12.6 Q32 15 21.1 12.6 Z" fill="#F08A24" stroke="#141414" stroke-width=".8"/>'
const CAPE = '<path d="M21.5 48.6 L25.8 55.5 L32 50.2 L38.2 55.5 L42.5 48.6" fill="#F08A24" stroke="#141414" stroke-width=".9" stroke-linejoin="round"/>'

function chibi(state, cwd, size, bare, model, costume) {
  const gear = gearOf(model)
  const witch = costume === 'halloween'

// ---- cards ----
const KIND = { permission: 'Permission', plan: 'Plan approval', question: 'Question', denied: 'Blocked by auto mode' }
const STATE = { permission: 'wait', plan: 'go', question: 'question', denied: 'denied' }
const RISK = { read: 'read', write: 'write', infra: 'infrastructure write' }
const MODES = [['', 'keep the mode'], ['default', 'ask'], ['acceptEdits', 'edits'], ['plan', 'plan'], ['auto', 'auto']]
const isGo = (label = '') => /^go$/i.test(label.trim())
const ago = (t) => {
  const s = Math.max(0, (Date.now() - t) / 1000)
  return s < 60 ? 'just now' : s < 3600 ? `${Math.floor(s / 60)} min ago` : `${Math.floor(s / 3600)} h ${Math.floor((s % 3600) / 60)} min ago`
}
// What a request would run, shown in full on its card (a workflow: its whole script).
const target = (input) => input.command ?? input.file_path ?? input.notebook_path ?? input.url ?? input.pattern ?? input.script ?? input.scriptPath ?? ''

function describe(suggestions) {
  return suggestions.map((s) =>
    s.type === 'addRules' ? (s.rules ?? []).map((r) => `${r.toolName}${r.ruleContent ? `(${r.ruleContent})` : ''}`).join(', ')
    : s.type === 'addDirectories' ? `access to ${(s.directories ?? []).join(', ')}`
    : s.type === 'setMode' ? `mode ${s.mode}` : s.type).join('; ')
}

let sessions = new Map()
const nameOf = (session, cwd) => sessions.get(session)?.name || project(cwd || sessions.get(session)?.cwd)
const modelFor = (session) => sessions.get(session)?.model
// A session's name opens its detail.
const link = (session, text) => h('a', { class: 'name', href: `#s=${encodeURIComponent(session)}` }, text)

const BODY = {
  permission(r, send) {
    const infra = r.risk === 'infra'
    const mode = h('select', { 'aria-label': 'Session mode after this answer' }, MODES.map(([v, l]) => h('option', { value: v }, l)))
    const typed = infra ? h('input', { type: 'text', name: 'go', autocomplete: 'off', placeholder: 'type GO', 'aria-label': 'Type GO to allow an infrastructure write' }) : null
    const reason = h('input', { type: 'text', placeholder: 'Why, for the agent (optional)', 'aria-label': 'Reason sent with a deny' })
    const rule = r.suggestions.length > 0 && !infra
    return [
      h('p', { class: 'tool' }, r.tool, r.mode ? ` · mode ${r.mode}` : ''),
      target(r.input) ? h('pre', { class: 'cmd' }, target(r.input)) : null,
      r.input.description ? h('p', { class: 'desc' }, r.input.description) : null,
      h('details', {}, h('summary', {}, 'Full input'), h('pre', {}, JSON.stringify(r.input, null, 2))),
      h('div', { class: 'actions' },
        typed,
        h('button', { class: 'primary', 'data-go': infra, onclick: () => send({ action: 'allow', mode: mode.value || undefined, typed: typed?.value }) }, 'Allow'),
        rule ? h('button', { title: describe(r.suggestions), onclick: () => send({ action: 'rule', mode: mode.value || undefined }) }, "Allow, don't ask again") : null,
        h('label', { class: 'mode' }, 'then', mode)),
      rule ? h('p', { class: 'desc' }, `Don't ask again for: ${describe(r.suggestions)}`) : null,
      h('div', { class: 'actions' },
        reason,
        h('button', { onclick: () => send({ action: 'deny', reason: reason.value }) }, 'Deny'),
        h('button', { class: 'quiet', onclick: () => send({ action: 'dismiss' }) }, 'Leave it to the terminal')),
    ]
  },

  question(r, send, card) {
    const qs = r.input.questions ?? []
    const free = h('textarea', { rows: 2, placeholder: 'Or answer in your own words', 'aria-label': 'Free answer' })
    const answers = () => Object.fromEntries(qs.map((q, i) => [q.question, [...card.querySelectorAll(`[name="r${r.id}q${i}"]:checked`)].map((x) => x.value).join(', ')]))
    return [
      ...qs.map((q, i) => h('fieldset', {},
        h('legend', {}, q.header ? h('span', { class: 'chip' }, q.header) : null, ' ', q.question),
        (q.options ?? []).map((o) => h('label', { class: 'option' },
          h('input', { type: q.multiSelect ? 'checkbox' : 'radio', name: `r${r.id}q${i}`, value: o.label }),
          h('span', {}, h('b', {}, o.label), o.description ? h('small', {}, o.description) : null))))),
      free,
      h('div', { class: 'actions' },
        h('button', { class: 'primary', onclick: () => send(free.value.trim() ? { action: 'answer', text: free.value.trim() } : { action: 'answer', answers: answers() }) }, 'Send'),
        h('button', { class: 'quiet', onclick: () => send({ action: 'dismiss' }) }, 'Leave it to the terminal')),
    ]
  },

  // ponytail: a plan approval asks one question by convention; the plan itself is whatever the
  // session put in the question and its option descriptions (its chat text comes with M2).
  plan(r, send) {
    const q = r.input.questions?.[0] ?? {}
    const typed = h('input', { type: 'text', name: 'go', autocomplete: 'off', placeholder: 'type GO', 'aria-label': 'Type GO to approve the plan' })
    return [
      h('p', { class: 'question' }, q.question),
      (q.options ?? []).filter((o) => o.description).map((o) => h('p', { class: 'desc' }, h('b', {}, o.label), ': ', o.description)),
      h('div', { class: 'actions' },
        typed,
        (q.options ?? []).map((o) => h('button', { class: isGo(o.label) ? 'primary' : null, 'data-go': isGo(o.label), onclick: () => send({ action: 'answer', answers: { [q.question]: o.label }, typed: typed.value }) }, o.label)),
        h('button', { class: 'quiet', onclick: () => send({ action: 'dismiss' }) }, 'Leave it to the terminal')),
    ]
  },

  denied(r, send) {
    return [
      h('p', { class: 'tool' }, r.tool, r.reason ? ` · ${r.reason}` : ''),
      target(r.input) ? h('pre', { class: 'cmd' }, target(r.input)) : null,
      h('div', { class: 'actions' },
        h('button', { class: 'primary', onclick: () => send({ action: 'retry' }) }, 'Let it retry'),
        h('button', { onclick: () => send({ action: 'dismiss' }) }, 'Keep it denied')),
    ]
  },
}

// Buttons marked data-go stay disabled until GO is typed in the card.
function gate(card) {
  const typed = $('input[name=go]', card)?.value.trim()
  card.querySelectorAll('[data-go]').forEach((b) => (b.disabled = typed !== 'GO'))
}

async function post(path, body) {
  const res = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
  return res.ok ? null : ((await res.json().catch(() => null))?.error ?? res.statusText)
}

function requestCard(r) {
  const name = nameOf(r.session, r.cwd)
  const card = h('article', { class: `card risk-${r.risk}` })
  const error = h('p', { class: 'error', role: 'alert' })
  const send = async (decision) => {
    card.querySelectorAll('button').forEach((b) => (b.disabled = true))
    error.textContent = (await post('/api/decide', { id: r.id, ...decision })) ?? ''
    if (!error.textContent) return // the server takes the card away
    card.querySelectorAll('button').forEach((b) => (b.disabled = false))
    gate(card)
  }
  card.append(
    h('div', { class: 'who' },
      avatar(STATE[r.kind], r.cwd, 64, `${name}: ${KIND[r.kind].toLowerCase()}`, false, modelFor(r.session)),
      h('div', {}, link(r.session, name), h('span', { class: 'meta' }, project(r.cwd), ' · ', h('time', { 'data-at': r.at }, ago(r.at)))),
      h('span', { class: 'badge' }, KIND[r.kind]),
      r.kind === 'permission' || r.kind === 'denied' ? h('span', { class: `risk ${r.risk}` }, RISK[r.risk]) : null),
    ...BODY[r.kind](r, send, card).flat().filter(Boolean),
    error)
  card.addEventListener('input', () => gate(card))
  gate(card)
  return card
}

// ---- energy and quota (companion mod, ADR-0004) ----
const ASLEEP_MS = 3 * 3600_000
const QUOTA = { five_hour: '5 h', seven_day: '7 d' }
const used = (s) => s?.usage?.context?.percent ?? 0
// Energy is the context left; below 10 % it turns red.
function energy(s) {
  if (s?.usage?.context?.percent == null) return null
  const left = Math.max(0, Math.round(100 - s.usage.context.percent))
  return h('span', { class: `energy${left < 10 ? ' low' : ''}`, role: 'meter', 'aria-valuemin': 0, 'aria-valuemax': 100, 'aria-valuenow': left, 'aria-label': `context left: ${left} %`, title: `context left: ${left} %` },
    h('span', { style: `width:${left}%` }))
}

// ---- board ----
const cards = new Map() // request id -> card, kept so a half-typed answer survives updates
const doneCards = new Map() // session@end of turn -> card, same reason for a half-typed reply
let first = true

// Sessions ignored from this browser: out of Done, Working and Asleep, listed under Ignored. Their
// requests still show in Waiting, so that none stalls unseen.
// ponytail: by session id, so a relaunched session shows again; by folder if that gets tedious.
let ignored = new Set()
try { ignored = new Set(JSON.parse(localStorage.getItem('clearance-ignored') ?? '[]')) } catch {}
function ignore(id, on) {
  if (on) ignored.add(id)
  else ignored.delete(id)
  try { localStorage.setItem('clearance-ignored', JSON.stringify([...ignored])) } catch {}
  if (lastSnap) render(lastSnap)
}

// A session's text with its light Markdown made readable: headings, bold, code and bullets. Built as
// nodes, never as HTML: the text comes from the session.
// ponytail: line by line, no nesting, tables or links; a Markdown parser if sessions need more.
function prose(text) {
  return text.split('\n').map((line, i) => {
    const head = /^#{1,6}\s+(.*)$/.exec(line)
    const parts = (head ? head[1] : line.replace(/^(\s*)[-*] /, '$1• ')).split(/(\*\*[^*]+\*\*|`[^`]+`)/).map((p) =>
      /^\*\*.+\*\*$/.test(p) ? h('b', {}, p.slice(2, -2)) : /^`.+`$/.test(p) ? h('code', {}, p.slice(1, -1)) : p)
    return [i ? '\n' : null, head ? h('b', { class: 'heading' }, parts) : parts]
  })
}

// A finished turn: its last message in full, and a reply the companion mod types into the session,
// which then turns busy and leaves Done on its own.
function doneCard(d) {
  const name = nameOf(d.session, d.cwd)
  const text = h('textarea', { rows: 2, 'aria-label': `Reply to ${name}`, placeholder: 'Reply, sent to the session as if you typed it' })
  const status = h('p', { class: 'meta', role: 'status' })
  return h('article', { class: 'card' },
    h('div', { class: 'who' },
      avatar(d.failed ? 'stopped' : 'done', d.cwd, 56, `${name}: ${d.failed ? 'stopped on error' : 'done'}`, false, modelFor(d.session)),
      h('div', {}, link(d.session, name), h('span', { class: 'meta' }, project(d.cwd), ' · ', h('time', { 'data-at': d.at }, ago(d.at)))),
      d.failed ? h('span', { class: 'risk infra' }, 'stopped on error') : null),
    d.message ? h('div', { class: 'message' }, prose(d.message)) : null,
    h('form', {
      class: 'instruct',
      onsubmit: async (e) => {
        e.preventDefault()
        const error = await post('/api/instruct', { session: d.session, text: text.value })
        if (!error) text.value = ''
        status.textContent = error ?? instructText(sessions.get(d.session), true)
      },
    }, text, h('div', { class: 'actions' },
      h('button', { class: 'primary', type: 'submit' }, 'Reply'),
      h('button', { type: 'button', onclick: () => post('/api/read', { session: d.session }) }, 'Mark as read'),
      h('button', { type: 'button', class: 'quiet', onclick: () => ignore(d.session, true) }, 'Ignore')), status))
}

function notify(r) {
  if (first || !('Notification' in window) || Notification.permission !== 'granted') return
  const what = (target(r.input) || r.input.questions?.[0]?.question || r.tool).slice(0, 200)
  new Notification(`${nameOf(r.session, r.cwd)}: ${KIND[r.kind].toLowerCase()}`, { body: what, tag: `clearance-${r.id}` })
}

function render(snap) {
  sessions = new Map(snap.sessions.map((s) => [s.sessionId, s]))

  const ids = new Set(snap.requests.map((r) => r.id))
  for (const [id, card] of cards) if (!ids.has(id)) { card.remove(); cards.delete(id) }
  const list = $('#waiting .cards')
  snap.requests.forEach((r, i) => {
    let card = cards.get(r.id)
    if (!card) { card = requestCard(r); cards.set(r.id, card); notify(r) }
    if (list.children[i] !== card) list.insertBefore(card, list.children[i] ?? null)
  })
  // Sessions waiting on something clearance does not hold: answer them in their terminal.
  const held = new Set(snap.requests.map((r) => r.session))
  const elsewhere = snap.sessions.filter((s) => s.status === 'waiting' && !held.has(s.sessionId))
  $('#waiting .terminal').replaceChildren(...elsewhere.map((s) => h('p', { class: 'terminal-wait' },
    avatar('wait', s.cwd, 36, null, false, s.model), h('span', {}, link(s.sessionId, s.name || project(s.cwd)),
      ` waits for you in its terminal${s.waitingFor ? ` (${s.waitingFor})` : ''}`,
      s.connected ? '' : h('span', { class: 'meta' }, ': not connected to clearance, answer it there')))))
  $('#waiting .empty').hidden = snap.requests.length + elsewhere.length > 0

  const done = snap.done.filter((d) => !ignored.has(d.session))
  const turns = new Set(done.map((d) => `${d.session}@${d.at}`))
  for (const [k, card] of doneCards) if (!turns.has(k)) { card.remove(); doneCards.delete(k) }
  const doneList = $('#done .cards')
  done.forEach((d, i) => {
    const k = `${d.session}@${d.at}`
    if (!doneCards.has(k)) doneCards.set(k, doneCard(d))
    const card = doneCards.get(k)
    if (doneList.children[i] !== card) doneList.insertBefore(card, doneList.children[i] ?? null)
  })
  $('#done .empty').hidden = done.length > 0

  const busy = snap.sessions.filter((s) => s.status === 'busy' && !ignored.has(s.sessionId))
  $('#working .crew').replaceChildren(...busy.map((s) => h('div', { class: 'worker' },
    avatar(used(s) >= 90 ? 'dizzy' : 'work', s.cwd, 64, `${s.name || project(s.cwd)}: working${s.agents ? ` with ${s.agents} subagents` : ''}`, false, s.model),
    energy(s),
    link(s.sessionId, s.name || project(s.cwd)),
    h('span', { class: 'meta' }, project(s.cwd)),
    s.agents ? h('div', { class: 'clones' }, Array.from({ length: Math.min(s.agents, 5) }, () => avatar('work', s.cwd, 24, null, true)), s.agents > 5 ? `+${s.agents - 5}` : null) : null)))
  $('#working .empty').hidden = busy.length > 0

  // Idle for hours and not waiting to be read: candidates to close.
  const unread = new Set(snap.done.map((d) => d.session))
  const asleep = snap.sessions.filter((s) => s.status === 'idle' && !ignored.has(s.sessionId) && !unread.has(s.sessionId) && s.lastActive && Date.now() - s.lastActive > ASLEEP_MS)
  $('#asleep .crew').replaceChildren(...asleep.map((s) => h('div', { class: 'worker' },
    avatar('sleep', s.cwd, 56, `${s.name || project(s.cwd)}: asleep`, false, s.model),
    link(s.sessionId, s.name || project(s.cwd)),
    h('span', { class: 'meta' }, `idle ${span(Date.now() - s.lastActive)}`))))
  $('#asleep').hidden = asleep.length === 0 || location.hash.length > 1

  const shunned = snap.sessions.filter((s) => ignored.has(s.sessionId))
  $('#ignored .crew').replaceChildren(...shunned.map((s) => h('div', { class: 'worker' },
    avatar(s.status === 'busy' ? 'work' : s.status === 'waiting' ? 'wait' : 'sleep', s.cwd, 56, `${s.name || project(s.cwd)}: ignored, ${s.status}`, false, s.model),
    link(s.sessionId, s.name || project(s.cwd)),
    h('span', { class: 'meta' }, s.status),
    h('button', { type: 'button', 'aria-label': `Stop ignoring ${s.name || project(s.cwd)}`, onclick: () => ignore(s.sessionId, false) }, 'Unignore'))))
  $('#ignored').hidden = shunned.length === 0 || location.hash.length > 1

  const q = (snap.quota ?? []).filter((r) => QUOTA[r.kind])
  $('#quota').hidden = q.length === 0
  $('#quota').textContent = q.map((r) => `${QUOTA[r.kind]} ${Math.round(r.percentUsed)} %`).join(' · ')
  $('#quota').title = q.map((r) => `${QUOTA[r.kind]} window resets ${r.resetsAt ? new Date(r.resetsAt).toLocaleString() : 'later'}`).join('\n')

  const waiting = snap.requests.length
  document.title = waiting ? `(${waiting}) clearance` : 'clearance'
  $('#status').textContent = `live · ${snap.sessions.length} session${snap.sessions.length === 1 ? '' : 's'}`
  first = false
}

// ---- session detail (BRIEF section 3) ----
const short = (model = '') => model.replace(/^claude-/, '').replace(/-(\d+)-(\d+)$/, ' $1.$2')
const span = (ms) => {
  const s = Math.round(ms / 1000)
  return s < 60 ? `${s} s` : s < 3600 ? `${Math.round(s / 60)} min` : `${Math.floor(s / 3600)} h ${Math.round((s % 3600) / 60)} min`
}
const between = (a, b) => (a && b ? span(Date.parse(b) - Date.parse(a)) : '')
const clock = (t) => (t ? new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '')
// A path inside the session's folder, shown relative to it.
const inside = (file = '', cwd = '') => {
  const f = file.replace(/\\/g, '/'), c = cwd.replace(/\\/g, '/').replace(/\/$/, '')
  return c && f.toLowerCase().startsWith(c.toLowerCase() + '/') ? f.slice(c.length + 1) : file
}
const RUN_STATUS = { completed: 'closed', running: 'running', interrupted: 'interrupted', ended: 'ended without closure' }

function agentCard(a, cwd) {
  const state = a.running ? 'work' : a.result !== undefined ? 'done' : 'stopped'
  return h('div', { class: `agent${a.running ? ' running' : ''}` },
    h('div', { class: 'who' },
      avatar(state, cwd, 44, `${a.label}: ${a.running ? 'running' : 'finished'}`, true, a.model),
      h('div', {}, h('strong', {}, a.label), h('span', { class: 'meta' }, [a.type, short(a.model)].filter(Boolean).join(' · ')))),
    h('span', { class: 'meta' },
      [a.running ? `running for ${between(a.start, new Date().toISOString())}` : between(a.start, a.end), `${a.tools} tool call${a.tools === 1 ? '' : 's'}`].filter(Boolean).join(' · '),
      a.errors ? h('span', { class: 'bad' }, ` · ${a.errors} in error`) : null),
    a.result ? h('p', { class: 'result' }, a.result) : null)
}

// Phases the workflow declares: done in ink, the current one in yellow, those still to come dashed.
function runView(run, cwd) {
  const phases = [...run.phases]
  for (const a of run.agents) if (a.phase && !phases.includes(a.phase)) phases.push(a.phase)
  const live = run.status === 'running'
  const ran = new Set(run.agents.map((a) => a.phase))
  const of = (p) => run.agents.filter((a) => a.phase === p)
  return [
    h('p', { class: 'meta' }, `${run.name} · ${RUN_STATUS[run.status] ?? run.status} · started ${clock(run.start)}`, run.durationMs ? ` · ${span(run.durationMs)}` : ''),
    phases.length ? h('div', { class: 'phases' }, phases.map((p) => h('span', { class: `phase ${live && p === run.current ? 'now' : ran.has(p) ? 'past' : 'next'}` }, p))) : null,
    h('h4', {}, run.current ? `${live ? 'Now' : 'Last'}: ${run.current}` : 'Agents'),
    h('div', { class: 'agents' }, (run.current ? of(run.current) : run.agents).map((a) => agentCard(a, cwd))),
    phases.filter((p) => p !== run.current && of(p).length).map((p) =>
      h('details', {}, h('summary', {}, `${p} · ${of(p).length} agent${of(p).length === 1 ? '' : 's'}`), h('div', { class: 'agents' }, of(p).map((a) => agentCard(a, cwd))))),
  ]
}

function renderDetail(id, d, error) {
  const back = h('a', { class: 'back', href: '#' }, 'Back to the board')
  if (!d) return $('#detail-body').replaceChildren(back, h('p', { class: 'error' }, error || 'Nothing to show.'))
  const s = sessions.get(id)
  const cwd = s?.cwd
  const name = s?.name || project(cwd)
  const state = s?.status === 'waiting' ? 'wait' : s?.status === 'busy' ? (used(s) >= 90 ? 'dizzy' : 'work') : 'idle'
  instructState(s)
  const last = d.steps.at(-1)
  const run = d.runs.at(-1)
  const section = (title, ...body) => h('section', { class: 'card' }, h('h3', {}, title), body)
  const thread = [...d.prompts.map((p) => ({ at: p.at, prompt: p.text })), ...d.steps.map((step) => ({ at: step.at, step }))]
    .sort((a, b) => String(a.at).localeCompare(String(b.at))).slice(-80)
  // Keep what the user unfolded across refreshes.
  const open = new Set([...document.querySelectorAll('#detail details[open] > summary')].map((x) => x.textContent))
  const usage = s?.usage
  $('#detail-body').replaceChildren(h('div', {},
    back,
    h('div', { class: 'card head' },
      h('div', {}, avatar(state, cwd, 96, name, false, d.model), energy(s)),
      h('div', { class: 'grow' },
        h('h2', {}, d.title || name),
        h('div', { class: 'chips' }, [
          name, d.branch && `branch ${d.branch}`, short(d.model), d.mode && `mode ${d.mode}`, s?.status ?? 'not running',
          usage?.context?.percent != null && `context ${Math.round(usage.context.percent)} % used`,
          usage?.cost && `$${usage.cost.usd.toFixed(2)}`,
        ].filter(Boolean).map((c) => h('span', { class: 'chip' }, c))),
        last ? h('p', { class: 'meta' }, `Last: ${[last.tool, last.target, clock(last.at)].filter(Boolean).join(' · ')}`) : null,
        s ? h('div', { class: 'actions' }, h('button', { onclick: goTo(id) }, 'Go to terminal'), h('span', { class: 'meta', id: 'focus-status', role: 'status' })) : null)),
    run ? section('Workflow', runView(run, cwd)) : null,
    d.agents.length ? section('Subagents', h('div', { class: 'agents' }, d.agents.map((a) => agentCard(a, cwd)))) : null,
    d.loops.length || d.errors.length ? section('Errors and loops',
      d.loops.map((l) => h('p', { class: 'bad' }, `${l.count} failures in a row: ${l.tool} · ${l.target}`)),
      d.errors.slice(-15).reverse().map((e) => h('details', {}, h('summary', {}, `${clock(e.at)} ${[e.tool, e.target].filter(Boolean).join(' · ')}`), h('pre', {}, e.error ?? '')))) : null,
    d.edits.length ? section('Changes',
      d.edits.slice(-30).reverse().map((e) => h('details', {},
        h('summary', {}, `${clock(e.at)} ${inside(e.file, cwd)}${e.agent ? ` · ${e.agent}` : ''}`),
        e.before ? h('pre', { class: 'del' }, e.before) : null,
        e.after ? h('pre', { class: 'add' }, e.after) : null))) : null,
    section('What ran', h('div', { class: 'thread' }, thread.map((x) => x.prompt
      ? h('p', { class: 'bubble' }, x.prompt)
      : h('p', { class: `step${x.step.error ? ' bad' : ''}` }, `${clock(x.at)} ${[x.step.tool, x.step.target].filter(Boolean).join(' · ')}`)))),
    d.runs.length > 1 ? section('Workflow history', h('div', { class: 'scroll' }, h('table', {},
      h('thead', {}, h('tr', {}, ['Workflow', 'Started', 'Duration', 'Status', 'Agents'].map((t) => h('th', {}, t)))),
      h('tbody', {}, [...d.runs].reverse().map((r) => h('tr', {},
        h('td', {}, r.name), h('td', {}, r.start ? new Date(r.start).toLocaleString() : ''), h('td', {}, r.durationMs ? span(r.durationMs) : ''),
        h('td', {}, RUN_STATUS[r.status] ?? r.status), h('td', {}, r.agents.length))))))) : null))
  document.querySelectorAll('#detail details > summary').forEach((x) => { if (open.has(x.textContent)) x.parentElement.open = true })
}

let detailTimer
let detailKey = ''
async function loadDetail(id) {
  try {
    const res = await fetch(`/api/session/${encodeURIComponent(id)}`)
    const body = await res.json().catch(() => ({ error: res.statusText }))
    const key = JSON.stringify([body, sessions.get(id)])
    if (key === detailKey) return
    detailKey = key
    // A session that has not run a turn yet has no transcript: show what the board knows.
    const fresh = res.status === 404 && sessions.has(id) ? { prompts: [], steps: [], edits: [], errors: [], loops: [], runs: [], agents: [], model: sessions.get(id).model } : null
    renderDetail(id, res.ok ? body : fresh, body.error)
  } catch {}
}

// Brings the session's Windows Terminal tab to the front, or says which tab to look for.
const goTo = (id) => async (e) => {
  const res = await fetch('/api/focus', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ session: id }) })
  const body = await res.json().catch(() => ({}))
  const status = $('#focus-status')
  if (status) status.textContent = !res.ok ? (body.error ?? res.statusText) : body.found ? 'Tab brought to the front.' : `Tab not found: look for "${body.titles?.join('" or "')}".`
}

// Kept outside the refreshed part of the detail, so that typing survives updates.
function instructForm(id) {
  const text = h('textarea', { rows: 2, 'aria-label': 'Instruction for this session', placeholder: 'Sent to the session as if you typed it' })
  const status = h('p', { class: 'meta', id: 'instruct-status', role: 'status' })
  return h('form', {
    class: 'card instruct',
    onsubmit: async (e) => {
      e.preventDefault()
      const error = await post('/api/instruct', { session: id, text: text.value })
      if (error) return void (status.textContent = error)
      text.value = ''
    },
  }, h('h3', {}, 'Send an instruction'), text, h('div', { class: 'actions' }, h('button', { class: 'primary', type: 'submit' }, 'Send')), status)
}

// What the companion mod did with the last instruction, or why one would wait.
function instructState(s) {
  const status = $('#instruct-status')
  if (status) status.textContent = instructText(s)
}

// sent: just queued, before the next snapshot shows it.
function instructText(s, sent) {
  const fresh = s?.usage && Date.now() - s.usage.at < 30_000
  const i = s?.instruction
  return sent ? (fresh ? 'Sent: it reaches the session within 5 s.' : 'Queued: no companion mod is running in this session, answer it in its terminal.')
    : i?.delivered ? `Last instruction delivered at ${clock(i.delivered)}.`
    : i ? `Queued at ${clock(i.at)}${fresh ? ', delivered within 5 s.' : ': no companion mod is running in this session.'}`
    : fresh ? 'The companion mod runs in this session: an instruction arrives within 5 s.'
    : 'No companion mod runs in this session: an instruction would wait for one.'
}

async function loadJournal() {
  $('#journal').replaceChildren(h('p', { class: 'empty' }, 'Reading the journal and your approvals...'))
  const res = await fetch('/api/journal')
  const j = await res.json().catch(() => ({ error: res.statusText }))
  if (!res.ok) return $('#journal').replaceChildren(h('p', { class: 'error' }, j.error))
  const copy = (rule) => (e) => navigator.clipboard?.writeText(JSON.stringify(rule)).then(() => (e.target.textContent = 'Copied'))
  const what = (d) => d.kind === 'decision' ? [d.request, d.tool, d.target].filter(Boolean).join(' · ') : d.kind === 'instruction' ? `instruction: ${d.text}` : 'instruction delivered'
  $('#journal').replaceChildren(h('div', {},
    h('a', { class: 'back', href: '#' }, 'Back to the board'),
    h('section', { class: 'card' }, h('h3', {}, 'Suggested rules'),
      h('p', { class: 'desc' }, 'What you approved by hand at least three times, from your transcripts. Copy the rules you want into permissions.allow in your settings: clearance never writes them, and never suggests one for an infrastructure write.'),
      j.rules.length ? j.rules.map((r) => h('div', { class: 'rule' },
        h('div', { class: 'actions' }, h('code', {}, r.rule), h('button', { onclick: copy(r.rule) }, 'Copy')),
        h('span', { class: 'meta' }, `${r.count} approvals in ${r.sessions} session${r.sessions === 1 ? '' : 's'}, last on ${new Date(r.last).toLocaleDateString()}`),
        h('pre', {}, r.example))) : h('p', { class: 'empty' }, 'Nothing approved often enough yet.')),
    h('section', { class: 'card' }, h('h3', {}, 'Decisions taken here'),
      j.decisions.length ? h('div', { class: 'scroll' }, h('table', {},
        h('thead', {}, h('tr', {}, ['When', 'Session', 'What', 'Risk', 'Answer'].map((t) => h('th', {}, t)))),
        h('tbody', {}, j.decisions.map((d) => h('tr', {},
          h('td', {}, new Date(d.at).toLocaleString()), h('td', {}, nameOf(d.session, d.cwd)), h('td', {}, what(d)), h('td', {}, d.risk ?? ''), h('td', {}, d.action ?? ''))))))
        : h('p', { class: 'empty' }, 'No decision taken from this page yet.'))))
}

// #s=<session id> shows that session, #journal the journal; anything else, the board.
let lastSnap
function route() {
  const id = /^#s=([\w-]+)$/.exec(location.hash)?.[1]
  const journalView = location.hash === '#journal'
  clearInterval(detailTimer)
  detailKey = ''
  $('#detail').hidden = !id
  $('#journal').hidden = !journalView
  for (const sel of ['.columns', '#asleep', '#ignored']) $(sel).hidden = !!(id || journalView)
  scrollTo(0, 0)
  if (journalView) return void loadJournal()
  if (!id) return lastSnap && render(lastSnap)
  $('#detail').replaceChildren(h('div', { id: 'detail-body' }, h('p', { class: 'empty' }, 'Reading the session...')), instructForm(id))
  loadDetail(id)
  detailTimer = setInterval(() => loadDetail(id), 3000)
}
addEventListener('hashchange', route)
route()

setInterval(() => document.querySelectorAll('time[data-at]').forEach((t) => (t.textContent = ago(Number(t.dataset.at)))), 15_000)

const notifyButton = $('#notify')
if ('Notification' in window && Notification.permission === 'default') {
  notifyButton.hidden = false
  notifyButton.onclick = () => Notification.requestPermission().then(() => (notifyButton.hidden = true))
}

// ponytail: switching packs reloads the page rather than redrawing the cards in place.
const names = Object.keys(PACKS)
const other = names[(names.indexOf(pack) + 1) % names.length]
$('#pack').textContent = `Avatars: ${other}`
$('#pack').onclick = () => {
  try { localStorage.setItem('clearance-pack', other) } catch {}
  location.reload()
}

// Start a session in a new Windows Terminal tab; the folder is remembered in this browser.
const startForm = $('form.start')
const field = startForm.elements // form.name would be the form's own name
try { field.cwd.value = localStorage.getItem('clearance-cwd') ?? '' } catch {}

// + Start a session, in the header, opens the form at the top of the page.
$('#new').onclick = (e) => {
  const open = $('#start').hidden
  $('#start').hidden = !open
  e.currentTarget.setAttribute('aria-expanded', open)
  if (open) field.cwd.focus()
}

// Folder picker: the server lists sub-folders; recent folders are those of the live sessions and the
// last one started from here.
const picker = $('.picker', startForm)
async function browse(path) {
  const res = await fetch(`/api/folders?path=${encodeURIComponent(path ?? '')}`)
  const at = await res.json().catch(() => ({ error: res.statusText }))
  if (!res.ok) return picker.replaceChildren(h('p', { class: 'error' }, at.error), h('button', { type: 'button', onclick: () => browse('') }, 'Home'))
  const go = (label, to, title) => h('button', { type: 'button', title, onclick: () => browse(to) }, label)
  const recent = [...new Set([field.cwd.value, ...[...sessions.values()].map((s) => s.cwd)].filter(Boolean))]
  picker.replaceChildren(
    recent.length ? h('div', { class: 'actions' }, h('span', { class: 'meta' }, 'Recent'), recent.map((p) => go(project(p), p, p))) : null,
    h('div', { class: 'actions' }, at.drives.map((d) => go(d, d)), at.parent ? go('Up', at.parent, at.parent) : null, h('code', {}, at.path)),
    h('div', { class: 'folders' }, at.folders.length ? at.folders.map((f) => go(f, `${at.path.replace(/[\\/]$/, '')}${at.path.includes('\\') ? '\\' : '/'}${f}`)) : h('span', { class: 'meta' }, 'No folder here.')),
    h('div', { class: 'actions' }, h('button', { type: 'button', class: 'primary', onclick: () => { field.cwd.value = at.path; picker.hidden = true } }, 'Use this folder')))
}
$('#browse').onclick = () => {
  picker.hidden = !picker.hidden
  if (!picker.hidden) browse(field.cwd.value.trim())
}
startForm.onsubmit = async (e) => {
  e.preventDefault()
  const status = $('[role=status]', startForm)
  const name = field.name.value.trim()
  const error = await post('/api/start', { cwd: field.cwd.value.trim(), name, model: field.model.value, mode: field.mode.value, connect: field.connect.checked })
  status.textContent = error ?? `Started: the tab "${name}" opened in Windows Terminal.`
  if (!error) try { localStorage.setItem('clearance-cwd', field.cwd.value.trim()) } catch {}
}

const events = new EventSource('/events')
events.onmessage = (e) => render((lastSnap = JSON.parse(e.data)))
events.onerror = () => ($('#status').textContent = 'connection lost, retrying...')
</script>
</body>
</html>
