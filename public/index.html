/* ---- end of skins ---- */

* { box-sizing: border-box }
html, body { margin: 0; height: 100% }
body { font-family: var(--font); font-size: var(--fs); line-height: 1.5; color: var(--ink); background-color: var(--page); background-image: var(--pattern); background-size: var(--pattern-size) }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
svg.i { flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round }
code, pre, kbd { font-family: var(--mono) }

.app { height: 100vh; display: flex; flex-direction: column }
.top { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 20px; border-bottom: var(--bw2) solid var(--edge); background: var(--paper) }
.logo { display: inline-flex; flex: none; border-radius: 14px; text-decoration: none }
.counts { display: flex; gap: 8px }
.count { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; font-weight: 800; background: var(--paper); border: var(--bw) solid var(--edge); border-radius: var(--pill) }
.count.wait { color: var(--onRed); background: var(--red) }
.count.watch { color: var(--onOrange); background: var(--orange) }
.count.done svg { color: var(--green) }
.spacer { flex: 1 1 8px }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; font-weight: 700; color: var(--ink); background: var(--paper); border: var(--bw) solid var(--edge); border-radius: var(--pill); cursor: pointer; text-decoration: none; white-space: nowrap }
.btn.icon { width: 44px; padding: 0 }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px }
.btn.icon.sm { width: 36px; padding: 0 }
.btn.primary { color: var(--onPrimary); background: var(--primary); border-color: var(--primary) }
.btn.danger { color: var(--danger); border-color: var(--danger) }
.btn.stop { color: var(--onStop); background: var(--stop); border-color: var(--stop) }
.btn.quiet { background: transparent; border-style: dashed }
.btn.flat { background: transparent; border-color: transparent }
.btn:disabled { opacity: .4; cursor: not-allowed }
.search { flex: 1 1 220px; max-width: 380px; justify-content: flex-start; color: var(--muted); font-weight: 400 }
.gauge { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 4px 10px; background: var(--paper); border: var(--bw) solid var(--edge); border-radius: var(--r); box-shadow: var(--shadow-s) }
.gauge b { font-family: var(--display); font-size: 15px; line-height: 1 }
.cells { display: flex; gap: 2px }

// Everything that comes from a session (commands, questions, messages) goes through h() as text, never
// through innerHTML. The avatar and icon SVG are built from constants only.
const $ = (sel, root = document) => root.querySelector(sel)

function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v)
    else if (k === 'class') el.className = v
    else if (k === 'value') el.value = v
    else el.setAttribute(k, v === true ? '' : v)
  }
  el.append(...kids(children))
  return el
}
// Children as h() takes them: nested lists flattened, null and false dropped.
const kids = (list) => list.flat(Infinity).filter((c) => c != null && c !== false).map((c) => (c instanceof Node ? c : String(c)))
const fill = (el, ...children) => el.replaceChildren(...kids(children))

// Per browser: skin, language, avatar pack, ignored sessions, muted groups, folded queue.
const store = {
  get(key, fallback) { try { const v = localStorage.getItem(`clearance-${key}`); return v == null ? fallback : JSON.parse(v) } catch { return fallback } },
  set(key, value) { try { localStorage.setItem(`clearance-${key}`, JSON.stringify(value)) } catch {} },
}

async function post(path, body) {
  try {
    const res = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
    const out = await res.json().catch(() => ({}))
    return res.ok ? null : (out.error ?? res.statusText)
  } catch (e) { return String(e.message || e) }
}

// What the queue shows, in order: waiting (hot environments first), to watch, to read, working; then
// asleep and ignored.
function lists() {
  const visible = (s) => s && !ignored.has(s.sessionId) && inGroup(s)
  const requests = snap.requests.filter((r) => !pending.has(r.id) && visible(sessionOf(r.session) ?? { sessionId: r.session, cwd: r.cwd }))
  requests.sort((a, b) => isHot(b) - isHot(a))
  const firstOf = new Map()
  for (const r of requests) if (!firstOf.has(r.session)) firstOf.set(r.session, r)
  const settled = (snap.settled ?? []).filter((r) => !firstOf.has(r.session) && visible(sessionOf(r.session) ?? { cwd: r.cwd, sessionId: r.session }))
  const done = (snap.done ?? []).filter((d) => !pending.has(`read:${d.session}`) && !firstOf.has(d.session) && visible(sessionOf(d.session)))
  const reading = new Set(done.map((d) => d.session))
  const live = snap.sessions.filter((s) => visible(s) && !firstOf.has(s.sessionId) && !reading.has(s.sessionId))
  const terminalWaits = live.filter((s) => s.status === 'waiting')
  const watch = live.filter((s) => s.status !== 'waiting' && watchOf(s))
  const working = live.filter((s) => s.status === 'busy' && !watchOf(s))
  const asleep = live.filter((s) => s.status === 'idle' && s.lastActive && Date.now() - s.lastActive > 3 * 3600_000)
  const ignoredList = snap.sessions.filter((s) => ignored.has(s.sessionId))
  return { waiting: [...firstOf.values()], terminalWaits, settled, watch, done, working, asleep, ignored: ignoredList }
}

  return suggestions.flatMap((s) => (s.rules ?? []).map((r) => (r.ruleContent ? `${r.toolName}(${r.ruleContent})` : r.toolName))).join(', ') || '?'
}
function reviewCard(d) {
  const s = sessionOf(d.session) ?? {}
  const f = s.facts ?? {}
  const files = detailOf === sel ? (detail?.files ?? []) : []
  const plus = files.reduce((n, x) => n + x.plus, 0), minus = files.reduce((n, x) => n + x.minus, 0)
  return h('article', { class: 'card review', 'aria-label': t('review') },
    h('strong', { style: 'display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.05em;text-transform:uppercase' }, icon('verified', 16), t('facts')),
    h('div', { class: 'actions' },
      h('span', { class: `pill ${f.tests ? (f.tests.ok ? 'ok' : 'ko') : 'none'}`, title: f.tests?.summary ?? '' }, icon('flask', 16), f.tests ? (f.tests.ok ? t('tests.ok') : t('tests.ko')) : t('tests.none')),
      h('span', { class: 'pill none' }, icon('diff', 16), t('files', { n: f.files ?? files.length }), plus || minus ? [' · ', h('span', { class: 'plus' }, `+${plus}`), ' ', h('span', { class: 'minus' }, `-${minus}`)] : null),
      h('span', { class: 'pill none' }, icon('commit', 16), t('commits', { n: f.commits ?? 0 })),
      f.mr ? h('a', { class: 'pill none', href: f.mr, target: '_blank', rel: 'noopener' }, icon('mr', 16), 'MR') : null),
    h('div', { class: 'actions' },
      h('button', { type: 'button', class: 'btn primary', 'data-key': 'e', title: `${t('validate')}  e`, onclick: () => queueRead(d) }, icon('check'), t('validate')),
      h('button', { type: 'button', class: 'btn', onclick: () => { drafts.set(sel, t('fix.text')); renderPane(); $('#composer')?.focus() } }, icon('pencil'), t('fix')),
      btn('icon', t('diff'), 'eye', () => { tab = 'thread'; $('#inspector')?.scrollIntoView() })))
}

// Every answer waits 5 s before it leaves, so that it can be taken back; the next request opens at once.
function queueDecision(r, body, label, next) {
  const id = r.id
  pending.set(id, { timer: setTimeout(async () => {
    pending.delete(id)
    const err = await post('/api/decide', { id, ...body })
    if (err) { answered.delete(r.session); toast(error(err), 'alert'); render(); return }
  }, 5000) })
  answered.set(r.session, t('from.clearance', { what: t(`decided.${label}`), time: clock(Date.now()) }))
  toast(`${t(`decided.${label}`)} · ${named(r.session)}`, 'check', () => {
    clearTimeout(pending.get(id)?.timer); pending.delete(id); answered.delete(r.session); select(r.session)
  })
  select(next && next !== r.session ? next : r.session)
}
function queueRead(d) {
  const key = `read:${d.session}`
  const L = lists(), queue = order(L)
  const next = queue[queue.indexOf(d.session) + 1] ?? queue.find((x) => x !== d.session)
  pending.set(key, { timer: setTimeout(() => { pending.delete(key); post('/api/read', { session: d.session }) }, 5000) })
  toast(`${t('decided.validate')} · ${named(d.session)}`, 'check', () => { clearTimeout(pending.get(key)?.timer); pending.delete(key); select(d.session) })
  select(next ?? d.session)
}

// ---- composer: written as if typed in the session, delivered by its companion mod ----
function composer(s) {
  const id = s.sessionId
  const fresh = s.usage && Date.now() - s.usage.at < 30_000
  const r = requestOf(id)
  const delivery = !fresh ? t('delivery.nomod') : s.status === 'busy' ? t('delivery.busy') : r ? t('delivery.waits') : t('delivery.ready')
  const area = h('textarea', { id: 'composer', class: 'field', rows: 2, 'aria-label': t('write.to', { name: nameOf(s) }), placeholder: t('write.to', { name: nameOf(s) }), value: drafts.get(id) ?? '',
    oninput: () => drafts.set(id, area.value), onkeydown: (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submit() } } })
  async function submit() {
    const text = area.value.trim()
    if (!text) return
    const err = await post('/api/instruct', { session: id, text })
    if (err) return toast(error(err), 'alert')
    drafts.delete(id)
    const list = sent.get(id) ?? []
    list.push({ text, status: s.status === 'busy' ? t('sent.busy', { time: clock(Date.now()) }) : t('sent.ready', { time: clock(Date.now()) }) })
    sent.set(id, list)
    area.value = ''
    renderThread()
  }
  return h('div', { class: 'composer' },
    h('div', { class: 'row' }, area, h('button', { type: 'button', class: 'btn icon primary send', 'aria-label': t('send'), title: `${t('send')}  Ctrl Enter`, onclick: submit }, icon('send', 22))),
    h('span', { class: 'meta', style: 'display:inline-flex;align-items:center;gap:6px' }, icon('clock', 14), delivery))
}

// ---- inspector: the task, the plan, files, tests, agents, cost ----
function renderInspector() {
  const box = $('#inspector')
  if (!box) return
  const s = sessionOf(sel) ?? {}
  const d = detailOf === sel ? detail : null
  const prompts = d?.prompts ?? []
  const todos = Array.isArray(d?.todos) ? d.todos : []
  const run = (d?.runs ?? []).at(-1)
  const steps = todos.length ? todos.map((x) => ({ text: x.content, state: x.status === 'completed' ? 'done' : x.status === 'in_progress' ? 'now' : 'todo' }))
    : run?.phases?.length ? run.phases.map((p) => ({ text: p, state: p === run.current ? 'now' : run.phases.indexOf(p) < run.phases.indexOf(run.current) ? 'done' : 'todo' })) : []
  const files = d?.files ?? []
  const agents = [...(d?.agents ?? []), ...(run?.agents ?? [])].filter((a) => a.running || a.errors)
  const f = s.facts ?? {}
  const usd = s.usage?.cost?.usd
  const section = (iconName, title, ...body) => h('section', {}, h('h3', {}, icon(iconName, 16), title), body)
  const model = h('select', { class: 'field', 'aria-label': t('model.next'), title: t('model.next'), onchange: async () => {
    const err = await post('/api/instruct', { session: sel, text: `/model ${model.value}` })
    toast(err ? error(err) : `${t('model.next')} · ${model.value}`, err ? 'alert' : 'chip')
  } }, ['', 'fable', 'opus', 'sonnet', 'haiku'].map((m) => h('option', { value: m, selected: m && (s.model ?? '').includes(m) ? true : null }, m || '·')))
  fill(box,
    section('flag', t('task'), h('p', { style: 'margin:0;font-size:15px;line-height:1.45' }, prompts.at(-1)?.text ?? s.title ?? '')),
    steps.length ? section('plan', t('plan'), steps.map((x) => h('div', { class: `step ${x.state}` }, icon(x.state === 'done' ? 'check' : x.state === 'now' ? 'now' : 'todo', 16), h('span', {}, x.text)))) : null,
    section('diff', `${t('files', { n: files.length })}`, files.length ? files.slice(-20).map((x) => h('div', { class: 'file', title: x.file }, h('code', {}, rel(x.file, s.cwd)), h('span', { class: 'plus' }, `+${x.plus}`), h('span', { class: 'minus' }, `-${x.minus}`))) : h('span', { class: 'meta' }, '·')),
    section('flask', t('tests'), h('span', { class: `pill ${f.tests ? (f.tests.ok ? 'ok' : 'ko') : 'none'}`, style: 'align-self:flex-start' }, f.tests ? `${f.tests.ok ? t('tests.ok') : t('tests.ko')}${f.tests.summary ? ` · ${f.tests.summary}` : ''}` : t('tests.none'))),
    agents.length ? section('agents', `${t('agents')} · ${agents.length}`, agents.map((a) => h('div', { class: 'agent' }, avatar(a.errors >= 3 ? 'dizzy' : 'work', { ...s, model: a.model }, 28), h('b', {}, a.label), h('span', { class: a.errors >= 3 ? 'loop' : 'meta' }, a.running ? '…' : a.errors ? `✗ ${a.errors}` : '')))) : null,
    section('coin', t('cost'), h('span', {}, h('strong', {}, usd != null ? `${usd.toFixed(2)} $` : '·'), ' ', h('span', { class: 'meta' }, s.usage?.rate ? t('cost.rate', { usd: `${s.usage.rate.toFixed(2)} $` }) : t('at.rest'))),
      h('label', { style: 'display:flex;align-items:center;gap:8px' }, icon('chip', 16), model)))
}

// ---- overlays: new task, search, groups, journal, settings ----
function overlay(...content) {
  const layer = h('div', { class: 'overlay', onclick: (e) => { if (e.target === layer) close() } }, h('div', { class: 'dialog', role: 'dialog', 'aria-modal': 'true' }, content))
  $('#layer').replaceChildren(layer)
  return layer
}
const close = () => $('#layer').replaceChildren()
const dialogHead = (iconName, title) => h('div', { class: 'row' }, h('h2', {}, icon(iconName, 22), title), btn('icon sm', t('close'), 'x', close))

function openPalette() {
  const recent = [...new Set(snap.sessions.map((s) => s.cwd).filter(Boolean))]
  const st = { folder: store.get('cwd', recent[0] ?? ''), model: 'sonnet', mode: 'auto' }
  const text = h('textarea', { class: 'field', rows: 3, placeholder: t('palette.prompt'), 'aria-label': t('palette.prompt') })
  const name = h('input', { class: 'field grow', 'aria-label': t('palette.name'), placeholder: t('palette.name') })
  const folders = h('div', { class: 'row', role: 'group', 'aria-label': t('folder') })
  const picker = h('div', { class: 'row', hidden: true })
  const groupLine = h('span', { class: 'meta' })
  const seg = (list, key, label) => h('div', { class: 'seg', role: 'group', 'aria-label': label }, list.map(([v, l]) => h('button', { type: 'button', 'aria-pressed': String(st[key] === v), onclick: (e) => { st[key] = v; e.target.parentNode.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === e.target))) } }, l)))
  const autoName = () => `${folderName(st.folder).toLowerCase().replace(/[^\w.-]/g, '-').slice(0, 30)}-${Math.random().toString(16).slice(2, 4)}`
  const drawFolders = () => {
    fill(folders, icon('folder'), [...new Set([st.folder, ...recent].filter(Boolean))].slice(0, 8).map((p) => h('button', { type: 'button', class: 'folder', 'aria-pressed': String(p === st.folder), title: p, onclick: () => { st.folder = p; name.value = autoName(); drawFolders() } }, h('span', { class: 'dot', style: `background:${colours(snap.groups?.[p] || folderName(p))[0]}` }), folderName(p))),
      btn('icon sm quiet', t('browse'), 'search', () => browse(st.folder)))
    groupLine.textContent = st.folder ? `${snap.groups?.[st.folder] || folderName(st.folder)} · ${t('group.auto')}` : ''
  }
  async function browse(path) {
    picker.hidden = false
    const res = await fetch(`/api/folders?path=${encodeURIComponent(path ?? '')}`)
    const at = await res.json().catch(() => ({}))
    if (!res.ok) return fill(picker, h('span', {}, error(at.error ?? '')), btn('sm', t('home'), null, () => browse(''), { text: t('home') }))
    fill(picker, at.drives.map((d) => btn('sm', d, null, () => browse(d), { text: d })), at.parent ? btn('sm', t('up'), 'arrowUp', () => browse(at.parent), { text: t('up') }) : null, h('code', {}, at.path),
      h('div', { class: 'row', style: 'width:100%' }, at.folders.map((f) => btn('sm', f, null, () => browse(`${at.path.replace(/[\\/]$/, '')}${at.path.includes('\\') ? '\\' : '/'}${f}`), { text: f }))),
      btn('primary sm', t('use.folder'), 'check', () => { st.folder = at.path; name.value = autoName(); picker.hidden = true; drawFolders() }, { text: t('use.folder') }))
  }
  const error_ = h('p', { class: 'meta', role: 'status' })
  name.value = autoName()
  drawFolders()
  const go = async () => {
    const err = await post('/api/start', { cwd: st.folder, name: name.value.trim(), model: st.model, mode: st.mode, prompt: text.value.trim() || undefined })
    if (err) { error_.textContent = t('err.start', { error: error(err) }); return }
    store.set('cwd', st.folder)
    close()
    toast(t('palette.started', { name: name.value.trim() }), 'play')
  }
  overlay(dialogHead('plus', t('palette.title')), text, folders, picker,
    h('div', { class: 'row' }, groupLine, name),
    h('div', { class: 'row' }, seg([['fable', 'fable'], ['opus', 'opus'], ['sonnet', 'sonnet'], ['haiku', 'haiku']], 'model', t('model')), seg([['default', t('mode.default')], ['auto', t('mode.auto')], ['plan', t('mode.plan')], ['acceptEdits', t('mode.acceptEdits')]], 'mode', t('mode'))),
    h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn primary', onclick: go }, icon('play'), t('palette.launch')), h('kbd', {}, 'Ctrl ⏎'), error_))
  text.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) go() })
  text.focus()
}

function openSearch() {
  const input = h('input', { class: 'field', style: 'width:100%', placeholder: t('search'), 'aria-label': t('search') })
  const hits = h('div', { class: 'hits', role: 'listbox' })
  const commands = [[t('new.task'), 'plus', () => openPalette()], [t('journal'), 'journal', openJournal], [t('groups.manage'), 'sliders', () => openGroups()], [t('settings'), 'sliders', openSettings], [folded ? t('unfold') : t('fold'), 'fold', () => { close(); fold(!folded) }]]
  let found = [], at = 0
  const draw = () => {
    const q = input.value.toLowerCase()
    const sessions = snap.sessions.filter((s) => `${nameOf(s)} ${s.cwd} ${s.title ?? ''} ${groupOf(s)}`.toLowerCase().includes(q)).map((s) => [nameOf(s), null, () => { close(); select(s.sessionId) }, s])
    found = [...sessions, ...commands.filter(([l]) => l.toLowerCase().includes(q))]
    at = Math.min(at, Math.max(0, found.length - 1))
    hits.replaceChildren(...found.map(([label, i, run, s], k) => h('button', { type: 'button', class: 'hit', role: 'option', 'aria-selected': String(k === at), onclick: run }, s ? avatar('done', s, 28) : icon(i), h('b', {}, label), s ? h('span', { class: 'meta' }, s.cwd) : null)))
  }
  input.addEventListener('input', () => { at = 0; draw() })
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { at = Math.min(at + 1, found.length - 1); draw(); e.preventDefault() }
    if (e.key === 'ArrowUp') { at = Math.max(at - 1, 0); draw(); e.preventDefault() }
    if (e.key === 'Enter') found[at]?.[2]()
  })
  overlay(input, hits)
  draw()
  input.focus()
}

function openGroups(focusCwd) {
  const folders = [...new Set(snap.sessions.map((s) => s.cwd).filter(Boolean))]
  const rows = folders.map((cwd) => {
    const input = h('input', { class: 'field grow', value: snap.groups?.[cwd] ?? '', placeholder: folderName(cwd), 'aria-label': cwd })
    return [cwd, input, h('div', { class: 'row' }, h('span', { class: 'dot', style: `background:${colours(snap.groups?.[cwd] || folderName(cwd))[0]}` }), h('code', { style: 'flex:1 1 300px' }, cwd), input)]
  })
  overlay(dialogHead('sliders', t('groups.title')), h('p', { class: 'meta', style: 'margin:0' }, t('groups.hint')), rows.map((x) => x[2]),
    h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn primary', onclick: async () => {
      for (const [cwd, input] of rows) if ((snap.groups?.[cwd] ?? '') !== input.value.trim()) await post('/api/group', { cwd, group: input.value.trim() })
      close()
    } }, icon('check'), t('save'))))
  ;(rows.find((x) => x[0] === focusCwd)?.[1] ?? rows[0]?.[1])?.focus()
}

async function openJournal() {
  const body = h('div', {}, '…')
  const layer = overlay(dialogHead('journal', t('journal.title')), body)
  layer.firstChild.classList.add('wide')
  const res = await fetch('/api/journal')
  const j = await res.json().catch(() => ({ decisions: [], rules: [] }))
  const what = (d) => d.kind === 'decision' ? [d.request, d.tool, d.target].filter(Boolean).join(' · ') : d.kind === 'instruction' ? d.text : d.kind
  fill(body,
    h('h3', {}, t('journal.rules')),
    j.rules.length ? j.rules.map((r) => h('p', {}, h('code', {}, r.rule), ' ', h('span', { class: 'meta' }, t('journal.rule', r)))) : h('p', { class: 'empty' }, '·'),
    h('h3', {}, t('journal.decisions')),
    j.decisions.length ? h('div', { style: 'overflow-x:auto' }, h('table', {}, h('thead', {}, h('tr', {}, [t('when'), t('session'), t('what'), t('risk'), t('action')].map((x) => h('th', {}, x)))),
      h('tbody', {}, j.decisions.map((d) => h('tr', {}, h('td', {}, new Date(d.at).toLocaleString(lang)), h('td', {}, d.name || named(d.session)), h('td', {}, what(d)), h('td', {}, d.risk ? t(`risk.${d.risk}`) : ''), h('td', {}, d.action ?? '')))))) : h('p', { class: 'empty' }, t('journal.none')))
}

function openSettings() {
  const pick = (label, value, options, onchange) => h('label', {}, label, h('select', { class: 'field', onchange: (e) => onchange(e.target.value) }, Object.entries(options).map(([v, l]) => h('option', { value: v, selected: v === value ? true : null }, l))))
  overlay(dialogHead('sliders', t('settings')), h('div', { class: 'menu' },
    pick(t('skin'), skin, SKINS, (v) => { skin = v; store.set('skin', v); document.documentElement.dataset.skin = v; render() }),
    pick(t('lang'), lang, { en: 'English', fr: 'Français' }, (v) => { lang = v; store.set('lang', v); document.documentElement.lang = v; post('/api/prefs', { lang: v }); close(); render() }),
    pick(t('pack'), packOf(), { manga: 'Manga', robots: 'Robots', halloween: 'Halloween' }, (v) => { store.set('pack', v); render() }),
    'Notification' in window ? h('button', { type: 'button', class: 'btn', disabled: Notification.permission !== 'default', onclick: () => Notification.requestPermission().then(close) }, icon('bell'), Notification.permission === 'granted' ? t('notify.on') : t('notify')) : null))
}

// ---- toast: what was just done, with a way back while it shows ----
function toast(text, iconName, undo) {
  clearTimeout(toastTimer)
  const box = h('div', { class: 'toast', role: 'status' }, icon(iconName, 20), h('span', {}, text),
    undo ? h('button', { type: 'button', class: 'undo', onclick: () => { undo(); $('#toast').replaceChildren() } }, t('undo')) : null, h('i'))
  $('#toast').replaceChildren(box)
  toastTimer = setTimeout(() => $('#toast').replaceChildren(), 5000)
}

// ---- keyboard ----
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); return }
  if (e.key === 'Escape') { close(); return }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName ?? '')
  if (typing || e.ctrlKey || e.metaKey || e.altKey || $('#layer').childElementCount) return
  const queue = order(lists())
  const click = (key) => $(`#pane [data-key="${key}"]`)
  if (e.key === 'j' || e.key === 'k') { const i = queue.indexOf(sel); select(queue[Math.max(0, Math.min(queue.length - 1, i + (e.key === 'j' ? 1 : -1)))] ?? queue[0] ?? null) }
  else if (e.key === 'a') { const go = $('#pane input[name=go]'); go && go.value.trim().toUpperCase() !== 'GO' ? go.focus() : click('a')?.click() }
  else if (e.key === 'd') click('d')?.click()
  else if (e.key === 'e') click('e')?.click()
  else if (/^[1-9]$/.test(e.key)) $(`#pane [data-option="${e.key}"]`)?.click()
  else if (e.key === 'r') $('#composer')?.focus()
  else if (e.key === 'n') openPalette()
  else if (e.key === 't') { tab = tab === 'thread' ? 'terminal' : 'thread'; renderPane() }
  else if (e.key === '[') fold(!folded)
  else return
  e.preventDefault()
})

// ---- updates ----
let seen = new Set()
function notify(fresh) {
  if (!('Notification' in window) || Notification.permission !== 'granted' || !seen.size) return
  for (const r of fresh) {
    const s = sessionOf(r.session)
    if (muted.has(groupOf(s ?? { cwd: r.cwd }))) continue
    new Notification(`${nameOf(s ?? { cwd: r.cwd })}: ${t(`${r.kind === 'permission' ? 'perm' : r.kind}.kind`)}`, { body: String(cmdOf(r.input)).slice(0, 200), tag: `clearance-${r.id}` })
  }
}
function render() { renderTop(); renderQueue(); if (!$('#pane').contains(document.activeElement) || !document.activeElement.matches('input, textarea, select')) renderPane() }

const events = new EventSource('/events')
events.onmessage = (e) => {
  const before = JSON.stringify(requestOf(sel) ?? null)
  snap = JSON.parse(e.data)
  if (snap.lang && !store.get('lang', null) && snap.lang !== lang && I18N[snap.lang]) { lang = snap.lang; document.documentElement.lang = lang }
  const fresh = snap.requests.filter((r) => !seen.has(r.id))
  notify(fresh)
  seen = new Set(snap.requests.map((r) => r.id).concat(seen.size ? [...seen] : ['start']))
  if (!sel) sel = order(lists())[0] ?? null
  renderTop(); renderQueue()
  // The pane is redrawn when what it shows changed, not under the user's typing.
  const typing = $('#pane').contains(document.activeElement) && document.activeElement.matches('input, textarea, select')
  if (!typing && (JSON.stringify(requestOf(sel) ?? null) !== before || !$('#view'))) renderPane()
  else if (!typing) { renderThread(); renderInspector() }
  if (detailOf !== sel) loadDetail()
}
events.onerror = () => toast(t('offline'), 'alert')
render()
</script>
