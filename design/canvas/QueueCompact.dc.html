<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>File compacte</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700;800&amp;family=Atkinson+Hyperlegible+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2457C5}a:hover{color:#1A3F8F}
.srow:hover{background:#ECEEF2}
.ghead:hover .gact{opacity:1}
.ghead:focus-within .gact{opacity:1}
@keyframes wave{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
.busy i{display:block;width:4px;height:4px;border-radius:999px;background:#1F4E9E;animation:wave 1.2s ease-in-out infinite}
.busy i:nth-child(2){animation-delay:.15s}.busy i:nth-child(3){animation-delay:.3s}
@keyframes arrive{0%{background:#FFC21A}100%{background:var(--bg)}}
.arrive{animation:arrive 1.6s ease-out 1}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,138,36,.6)}50%{box-shadow:0 0 0 5px rgba(240,138,36,0)}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.pop{animation:pop .4s ease-out 1}
@media (prefers-reduced-motion: reduce){.busy i,.arrive,.pulse,.pop{animation:none}}
</style>
</helmet>
<div style="position: relative; width: {{width}}px; height: 1180px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 14px; background: #FFFFFF; border-right: 3px solid #141414; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; font-size: 15px; color: #141414; overflow: hidden">
  <button type="button" aria-label="Largeur de la file : tirer pour élargir ou réduire, double-clic pour revenir à 420 px" title="Tirer pour élargir ou réduire · double-clic : 420 px" style="position: absolute; top: 540px; right: -1px; width: 12px; height: 56px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: #FFFFFF; border: 2px solid #141414; border-right: 0; border-radius: 6px 0 0 6px; cursor: col-resize">
    <i style="width: 3px; height: 3px; border-radius: 999px; background: #141414"></i><i style="width: 3px; height: 3px; border-radius: 999px; background: #141414"></i><i style="width: 3px; height: 3px; border-radius: 999px; background: #141414"></i>
  </button>

  <div style="display: flex; align-items: center; gap: 8px">
    <button type="button" aria-label="Replier la file" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 2px solid #141414; border-radius: 999px; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 6l-6 6 6 6M19 6l-6 6 6 6"></path></svg>
    </button>
    <button type="button" style="height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 14px; font: 800 14px 'Atkinson Hyperlegible Next', sans-serif; color: #141414; background: #FFFFFF; border: 2px solid #141414; border-radius: 999px; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Nouveau groupe
    </button>
    <button type="button" aria-label="Gérer les groupes" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: none; border: 0; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M16 5v4M10 15v4"></path></svg>
    </button>
  </div>

  <section aria-label="T'attendent" style="display: flex; flex-direction: column; gap: 8px">
    <h2 style="align-self: flex-start; margin: 0; display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #FFFFFF; background: #141414">T'attendent · 2</h2>
    <sc-for list="{{waiting}}" as="w" hint-placeholder-count="2">
      <button type="button" class="{{w.cls}}" style="--bg: {{w.bg}}; display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; text-align: left; background: {{w.bg}}; border: 2px solid #141414; border-radius: 10px; box-shadow: 3px 3px 0 #141414; cursor: pointer; font: inherit; color: inherit">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="{{w.kind}}"><path d="{{w.kindIcon}}"></path></svg>
        <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="display: flex; align-items: center; gap: 6px; min-width: 0">
            <b style="font-weight: 800; white-space: nowrap">{{w.name}}</b>
            <span style="font-size: 12px; font-weight: 800; padding: 0 7px; border-radius: 4px; background: {{w.tagBg}}; color: {{w.tagInk}}">{{w.group}}</span>
            <sc-if value="{{w.env}}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; font-weight: 800; padding: 1px 6px; border: 1.5px solid #A3200C; border-radius: 4px; color: #A3200C; letter-spacing: .04em">{{w.env}}</span></sc-if>
            <span style="flex: 1 1 auto"></span>
            <span style="font-size: 13px; color: #4A4A4A; white-space: nowrap">{{w.ago}}</span>
          </span>
          <span style="font-size: 14px; color: #2A2A2A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: {{w.font}}">{{w.what}}</span>
        </span>
      </button>
    </sc-for>
  </section>

  <section aria-label="À surveiller" style="display: flex; flex-direction: column; gap: 4px">
    <h2 style="align-self: flex-start; margin: 0 0 4px; padding: 4px 12px; font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #141414; background: #F08A24; border: 2px solid #141414">À surveiller · 1</h2>
    <button type="button" class="srow" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; text-align: left; background: #FFFFFF; border: 0; border-radius: 6px; cursor: pointer; font: inherit; color: inherit">
      <span class="pulse" style="flex: none; width: 8px; height: 8px; border-radius: 999px; background: #F08A24"></span>
      <b style="flex: none; font-weight: 800">tide</b>
      <span style="flex: 1 1 auto; min-width: 0; font-size: 14px; color: #8A4A12; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Boucle : npm test ×6</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A4A12" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5l2-2v6h-6l2-2a5 5 0 1 0 1 6"></path></svg>
    </button>
  </section>

  <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
    <section aria-label="{{g.name}}" style="display: flex; flex-direction: column; gap: 1px; padding: 4px; border: 2px solid #141414; border-radius: 10px; background: #FAFAF7">
      <header class="ghead" style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 4px">
        <button type="button" aria-expanded="{{g.expanded}}" style="flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 4px; height: 32px; font: 800 15px 'Atkinson Hyperlegible Next', sans-serif; color: #141414; background: none; border: 0; cursor: pointer; text-align: left">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{g.chevron}}"></path></svg>
          <span style="width: 10px; height: 10px; border-radius: 999px; flex: none; background: {{g.dot}}"></span>
          <span style="white-space: nowrap">{{g.name}}</span>
          <span style="font-size: 13px; font-weight: 700; color: #4A4A4A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.counts}}</span>
        </button>
        <span style="font-size: 13px; color: #4A4A4A; white-space: nowrap">{{g.mem}}</span>
        <span class="gact" style="display: flex; gap: 2px; opacity: 0">
          <button type="button" aria-label="Mettre le groupe en sourdine" style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: none; border: 0; border-radius: 6px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 9-5M18 11v5l2 2H8M10 20a2 2 0 0 0 4 0M4 4l16 16"></path></svg></button>
          <button type="button" aria-label="Interrompre tout le groupe" style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: none; border: 0; border-radius: 6px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M9 6v12M15 6v12"></path></svg></button>
        </span>
      </header>
      <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
        <button type="button" class="srow" aria-current="{{r.current}}" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; text-align: left; background: {{r.bg}}; border: {{r.border}}; border-radius: 6px; cursor: pointer; font: inherit; color: inherit">
          <b style="flex: none; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: {{r.weight}}">{{r.name}}</b>
          <span style="flex: 1 1 auto; min-width: 0; font-size: 14px; color: #4A4A4A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span>
          <sc-if value="{{r.working}}" hint-placeholder-val="{{ true }}">
            <span role="meter" aria-label="Au travail, contexte restant {{r.pct}} %" style="flex: none; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800">
              <span class="busy" style="display: flex; align-items: center; gap: 2px; margin-right: 2px" aria-hidden="true"><i></i><i></i><i></i></span>
              <span style="display: flex; gap: 2px" aria-hidden="true">
                <sc-for list="{{r.cells}}" as="c" hint-placeholder-count="5"><i style="width: 4px; height: 12px; border-radius: 1px; background: {{c.color}}"></i></sc-for>
              </span>
              <span style="width: 34px; text-align: right">{{r.pct}} %</span>
            </span>
          </sc-if>
          <sc-if value="{{r.right}}" hint-placeholder-val="{{ false }}">
            <span style="flex: none; display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: {{r.rightInk}}; white-space: nowrap">
              <sc-if value="{{r.check}}" hint-placeholder-val="{{ false }}"><svg class="pop" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#16683D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
              {{r.right}}
            </span>
          </sc-if>
        </button>
      </sc-for>
      <sc-if value="{{g.drawers}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; gap: 4px; padding: 2px 4px 0">
          <sc-for list="{{g.drawers}}" as="d" hint-placeholder-count="2">
            <button type="button" aria-label="{{d.label}}" title="{{d.label}}" style="display: flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; font: 800 13px 'Atkinson Hyperlegible Next', sans-serif; color: #4A4A4A; background: none; border: 1.5px solid #C8C8C8; border-radius: 999px; cursor: pointer">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4A4A4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{d.icon}}"></path></svg>
              {{d.n}}
            </button>
          </sc-for>
        </div>
      </sc-if>
    </section>
  </sc-for>

  <span style="flex: 1 1 auto"></span>
  <p style="margin: 0; display: flex; flex-wrap: wrap; gap: 6px 12px; font: 700 12px 'Atkinson Hyperlegible Mono', monospace; color: #4A4A4A">j k · a · d · 1 2 3 · e · r · n · t · [ · Ctrl K</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"width":{"editor":"range","min":300,"max":640,"step":10,"unit":"px","default":420},"$preview":{"width":420,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const width = this.props.width ?? 420;
    const level = (p) => (p >= 50 ? '#1F9D5B' : p >= 25 ? '#FFC21A' : p >= 10 ? '#F08A24' : '#E8341C');
    const cells = (p) => [0, 1, 2, 3, 4].map((i) => ({ color: i < Math.round(p / 20) ? level(p) : '#DADADA' }));
    const work = (name, title, pct, hair, current) => ({ name, title, pct, hair, working: true, cells: cells(pct), right: '', weight: 700,
      current: current ? 'true' : 'false', bg: current ? '#FFF4CC' : '#FFFFFF', border: current ? '2px solid #141414' : '2px solid transparent' });
    const other = (name, title, right, hair, opts) => Object.assign({ name, title, right, hair, working: false, cells: [], pct: 0, weight: 700,
      check: false, rightInk: '#4A4A4A', current: 'false', bg: '#FFFFFF', border: '2px solid transparent' }, opts || {});
    const moon = 'M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z';
    const stop = 'M7 7h10v10H7z';
    const eyeOff = 'M3 3l18 18M10.6 6.1A9 9 0 0 1 21 12a14 14 0 0 1-2.4 3.2M6.5 6.6A14 14 0 0 0 3 12s3 6 9 6a8.6 8.6 0 0 0 4-1';
    return {
      width,
      waiting: [
        { name: 'lantern', group: 'Connecteurs', tagBg: '#E4EDFB', tagInk: '#1F4E9E', env: 'PROD', ago: '2 min', what: 'kubectl apply -f deploy.yaml', bg: '#FFF4CC', font: "'Atkinson Hyperlegible Mono', monospace",
          kind: 'Permission à donner', kindIcon: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z', cls: '' },
        { name: 'quarry', group: 'Outils', tagBg: '#EFE8FE', tagInk: '#5B2FC0', env: '', ago: '<1 min', what: 'Quel format de date pour l’export ?', bg: '#FFFFFF', font: 'inherit',
          kind: 'Question posée', kindIcon: 'M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0-18 0M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01', cls: 'arrive' },
      ],
      groups: [
        { name: 'Connecteurs', dot: '#3D7BE0', counts: '6 au travail · 1 à relire', mem: '3,1 Go', expanded: 'true', chevron: 'M6 9l6 6 6-6',
          rows: [
            other('harbor', 'Lot 2 validé, 14 tests verts', '3 min', '#3D7BE0', { check: true, rightInk: '#16683D', weight: 800 }),
            work('orchard', 'Import du lot 3', 56, '#3D7BE0', true),
            work('meadow', 'Tests de mapping', 71, '#3D7BE0'),
            work('willow', 'Revue MR !41', 12, '#3D7BE0'),
            work('cedar', 'Correction CSV des encaissements', 33, '#3D7BE0'),
            work('birch', '3 agents · audit des dépendances', 48, '#3D7BE0'),
            work('alder', 'Rédaction du README', 88, '#3D7BE0'),
            other('aspen', 'Prête', '12 min', '#3D7BE0'),
          ],
          drawers: [{ icon: moon, n: 2, label: '2 endormies' }, { icon: stop, n: 1, label: '1 arrêtée' }, { icon: eyeOff, n: 1, label: '1 ignorée' }] },
        { name: 'Infra', dot: '#8B5CF6', counts: '1 au travail', mem: '666 Mo', expanded: 'true', chevron: 'M6 9l6 6 6-6',
          rows: [work('deploy', 'Suppression du job de rafraîchissement', 65, '#8B5CF6')], drawers: null },
        { name: 'Outils', dot: '#13A3A3', counts: '2 au repos', mem: '410 Mo', expanded: 'false', chevron: 'M9 6l6 6-6 6', rows: [], drawers: null },
        { name: 'Sans groupe', dot: '#F08A24', counts: '1 en échec · 1 au repos', mem: '1,1 Go', expanded: 'true', chevron: 'M6 9l6 6 6-6',
          rows: [
            other('poc', 'Arrêtée sur une erreur d’API', '5 min', '#F08A24', { right: '✕ 5 min', rightInk: '#A3200C', weight: 800 }),
            other('notes', 'Tri du matin', '33 min', '#F08A24'),
          ],
          drawers: [{ icon: stop, n: 3, label: '3 arrêtées' }] },
      ],
    };
  }
}
</script>
</body>
</html>
