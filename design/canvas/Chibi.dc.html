<script type="text/x-dc" data-dc-script data-props='{"av":{"editor":null},"size":{"editor":"int","default":128,"min":20,"max":256},"bare":{"editor":"boolean","default":false},"$preview":{"width":128,"height":128}}'>
class Component extends DCLogic {
  renderVals() {
    const av = this.props.av || { hair: '#3D7BE0', eye: '#1F4E9E', tint: '#E4EDFB', model: 'opus', state: 'wait', label: 'shop-0a, Opus, attend une permission' };
    const size = Number(this.props.size ?? 128);
    const st = av.state;
    const OPEN = 'M23.3 33 a2.2 3 0 1 0 4.4 0 a2.2 3 0 1 0 -4.4 0 M36.3 33 a2.2 3 0 1 0 4.4 0 a2.2 3 0 1 0 -4.4 0';
    const WIDE = 'M22.9 33 a2.6 3.6 0 1 0 5.2 0 a2.6 3.6 0 1 0 -5.2 0 M35.9 33 a2.6 3.6 0 1 0 5.2 0 a2.6 3.6 0 1 0 -5.2 0';
    const NONE = 'M0 0';
    const EYES = {
      work: [OPEN, NONE], wait: [OPEN, NONE], go: [WIDE, NONE], question: [OPEN, NONE],
      denied: [NONE, 'M23 31 L27.5 33 L23 35 M41 31 L36.5 33 L41 35'],
      done: [NONE, 'M23 34 Q25.5 30.5 28 34 M36 34 Q38.5 30.5 41 34'],
      sleep: [NONE, 'M23 33.5 Q25.5 35 28 33.5 M36 33.5 Q38.5 35 41 33.5'],
      dizzy: [NONE, 'M25.5 33 m-2.6 0 a2.6 2.6 0 1 0 2.6 -2.6 a1.6 1.6 0 1 0 1.6 1.6 M38.5 33 m-2.6 0 a2.6 2.6 0 1 0 2.6 -2.6 a1.6 1.6 0 1 0 1.6 1.6']
    };
    const BROWS = {
      work: 'M22.5 28 L28 29.2 M41.5 28 L36 29.2',
      wait: 'M22.5 29 L28 27.8 M41.5 29 L36 27.8',
      go: 'M22.5 27 Q25.5 25.5 28 27 M36 27 Q38.5 25.5 41.5 27',
      question: 'M22.5 27 Q25.5 25.5 28 27 M36 28.5 L41.5 28.5',
      denied: 'M22.5 27.5 L28 29.8 M41.5 27.5 L36 29.8',
      done: NONE, sleep: NONE,
      dizzy: 'M22.5 28.5 Q25.5 27.5 28 28.5 M36 28.5 Q38.5 27.5 41.5 28.5'
    };
    const MOUTH = {
      work: [NONE, 'M30 41.5 L34 41.5'],
      wait: [NONE, 'M28.5 42 Q30.2 40.8 32 42 Q33.8 43.2 35.5 42'],
      go: ['M32 39.6 a2 2.4 0 1 0 0.01 0', NONE],
      question: [NONE, 'M30.5 42 Q32 41 33.5 42'],
      denied: [NONE, 'M28.5 42.5 L30.2 41 L32 42.5 L33.8 41 L35.5 42.5'],
      done: ['M27.5 40.2 Q32 40.8 36.5 40.2 Q36 45 32 45 Q28 45 27.5 40.2 Z', NONE],
      sleep: [NONE, 'M32 41.2 a1.1 1.1 0 1 0 0.01 0'],
      dizzy: [NONE, 'M28.5 42 Q30.2 40.8 32 42 Q33.8 43.2 35.5 42']
    };
    const on = (b) => (b ? '1' : '0');
    const e = EYES[st] || EYES.work;
    const m = MOUTH[st] || MOUTH.work;
    return {
      label: av.label,
      px: size + 'px',
      tint: av.tint,
      bgOp: this.props.bare ? '0' : '1',
      hair: av.hair,
      eye: av.eye,
      eyesFillD: e[0], eyesStrokeD: e[1],
      shine: on(e[0] !== NONE),
      browsD: BROWS[st] || NONE,
      mouthFillD: m[0], mouthStrokeD: m[1],
      blush: (st === 'wait' || st === 'done' || st === 'question') ? '0.75' : '0',
      oGlasses: on(av.model === 'opus'),
      oPhones: on(av.model === 'sonnet'),
      oAhoge: on(av.model === 'haiku'),
      mSpeed: on(st === 'work'),
      mSweat: on(st === 'wait' || st === 'dizzy'),
      mBang: on(st === 'go'),
      mQ: on(st === 'question'),
      mVein: on(st === 'denied'),
      mSpark: on(st === 'done'),
      mZzz: on(st === 'sleep'),
      mDizzy: on(st === 'dizzy')
    };
  }
}
</script>
