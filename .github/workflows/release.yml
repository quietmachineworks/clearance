# A `v*` tag: the binaries for Windows and macOS on a GitHub release, its notes taken from the tag's
# CHANGELOG section.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            file: clearance.exe
            asset: clearance-windows-x86_64.exe
          - os: macos-latest
            file: clearance
            asset: clearance-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test
      - run: cargo build --release
      - shell: bash
        run: cp "target/release/${{ matrix.file }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Notes from the CHANGELOG section of this version
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## " v) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section '## ${GITHUB_REF_NAME#v}'"; exit 1; }
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "clearance $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
